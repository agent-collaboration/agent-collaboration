[package]
name = "board-upgrade-native-observer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "board-upgrade-central"
path = "src/central.rs"

[[bin]]
name = "board-request-shapes"
path = "src/request_shapes.rs"

[dependencies]
agent-router-update = { path = "../../../crates/agent-router-update" }
collaboration-protocol = { path = "../../../crates/collaboration-protocol" }
message-board = { path = "../../../crates/message-board" }
message-board-storage = { path = "../../../crates/message-board-storage" }
fleet-admission = { path = "../../../crates/fleet-admission" }
fleet-sync-protocol = { version = "0.4.0", git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "0b2742975ca8b20270929b89f4959c1987bdb090" }
fleet-sync-lease = { version = "0.4.0", git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "0b2742975ca8b20270929b89f4959c1987bdb090", default-features = false }
sqlx-turso = { version = "0.4.0", git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "0b2742975ca8b20270929b89f4959c1987bdb090", default-features = false }
collaboration-central-tokio = { path = "../../../crates/collaboration-central-tokio", features = ["conformance"] }
collaboration-central-conformance = { path = "../../../crates/collaboration-central-conformance" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# The root workspace's SQLx override, repeated because this standalone workspace
# does not inherit it. Remove with the root's when a released SQLx permits
# libsqlite3-sys 0.39 or newer.
# See docs/upstream-workarounds/2026-11-09-sqlx-git-pin-libsqlite3-0-39.md.
[patch.crates-io]
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-mysql = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-postgres = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
