[package]
name = "central-staging-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
board-fleet-sync = { path = "../../../crates/board-fleet-sync" }
collaboration-central-conformance = { path = "../../../crates/collaboration-central-conformance" }
fleet-sync-session = { git = "https://github.com/agent-collaboration/agent-fleet-sync.git", tag = "v0.3.0", default-features = false }
fleet-sync-protocol = { git = "https://github.com/agent-collaboration/agent-fleet-sync.git", tag = "v0.3.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
