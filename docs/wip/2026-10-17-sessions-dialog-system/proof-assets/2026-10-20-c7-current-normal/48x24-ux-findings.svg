<svg xmlns="http://www.w3.org/2000/svg" width="900" height="484" viewBox="0 0 900 484"><title>Two independently observed readability findings in the original 48 by 24 Quota screen</title><desc>Original raster is referenced unchanged at its native size. Red outlines and adjacent labels mark fragmented fact groups and a wrapping empty pace graphic. This explanatory annotation is not a product capture.</desc><rect width="900" height="484" fill="#151515"/><image href="48x24-failed/component-quota-browse.png" x="0" y="0" width="514" height="484"/><g fill="none" stroke="#ff6666" stroke-width="2"><rect x="220" y="158" width="108" height="107"/><path d="M328 184 L545 184"/><rect x="326" y="341" width="132" height="64"/><path d="M458 373 L545 373"/></g><g fill="#f4f4f4" font-family="sans-serif" font-size="17"><text x="550" y="173" font-weight="bold">P3 · Fragmented facts</text><text x="550" y="201">Keep counts with their units.</text><text x="550" y="226">Reduce label/value scanning cost.</text><text x="550" y="362" font-weight="bold">P3 · No-data graphic</text><text x="550" y="390">Empty bars wrap without meaning.</text><text x="550" y="415">Keep explicit unavailable text.</text></g></svg>
