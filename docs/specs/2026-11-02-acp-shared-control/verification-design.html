<ex-markdown id="verification-design" label="How We Verify"><script type="application/json" data-ex-markdown-source="">{"text":"# How we will know it works\n\nEach milestone earns evidence through the real boundary it changes. Controlled peers decide exact parsing and ordering cases; the original Codex CLI, shared PTY/wterm driver and actual provider decide user-visible compatibility. Neither substitutes for the other.\n\nEverything on this page is planned. Previous bridge results do not qualify a new source/build/provider tuple.\n\n## What proves each need\n\n| Need / obligations | Deciding observation | What a false pass would miss |\n| --- | --- | --- |\n| U1; R1/R22 | Fresh and resumed CLI connections to both providers, one real same-session reply, plus native Codex and reverse ACP preservation | A socket handshake or one provider's pass says nothing about the other provider. |\n| U2; R2/R3 | Pinned request/notification/callback/slash/key census and every chosen native disposition, including caller intents sharing a method | A list of names without effect/result-consumer coverage is not compatibility. |\n| U3; R4/R9 | Actual regular-picker default apply, with its success-only persistence confirmation after Enter; whole-run frames have no extra save error; the intended model/effort application is preserved with zero additional setting calls or Codex config writes from the extra save | No error or an advanced-path conversation-change line can pass when the save was never sent. |\n| U4; R5/R7/R8/R9/R18/R20 | Compare actual scoped facts/offers with display and responses, including client representation and exact callback authority | A guessed native default, parser-only offer, empty success or normalized-only callback fixture can look correct. |\n| U5; R6 | Same-connection correlation plus original styled history row count, exact admitted input and independent read/reopen | An observer alone cannot see the submitting connection's optimistic row. |\n| U6; R8/R10/R22 | Lasting TypeScript journeys through the real PTY/wterm and protocol entries, with complete error/effect/readback/lifecycle checks | A final clean frame misses an early error; a protocol ACK can hide a missing effect. |\n| U7; R11/R17/R21/R22 | Dependency/shape inspection, colocated discovery, backend registration and application-feature seam checks | Green tests can hide a reverse dependency, provider-name frontend switch, detached source or another state owner. |\n| U8; R12/R13/R14/R16/R18/R19/R20/R21 | One existing session receives distinct native/MCP/ACP inputs; observe each frontend's actual result, authority and shared work owner | Similar replies, a universal lowest-common DTO or one helper-level mock do not establish custody or protocol-specific results. |\n| U9; R15/R22 | Check the module/service/data map and each ordered workstream against its closing proof and dependencies | An attractive timeline can conceal storage decisions, serial dependencies or unmade contracts. |\n| U10; R16/R18/R19/R20 | A metadata-free standard ACP v1 client creates/attaches and controls an actual selected provider, with truthful capabilities and callbacks | A Router-aware fixture can hide missing caller/endpoint binding; a reply can hide wrong completion timing. |\n| U11; R17/R18/R22 | Register a standards-only controlled ACP agent and qualify named actual backends through unchanged frontend code | Another hardcoded frontend provider branch or invented generic feature can pass a single-provider run. |\n| U12; R21 | Exercise an existing application-owned feature through its real owner and permitted representations, preserving admission and observed effects | A provider-only intersection, raw transcript bypass or ACK-as-effect can conceal ownership duplication. |\n\n## Shared proof routes\n\n### A0 — Provider initialization authentication\n\nUse the existing runtime and controlled ACP peer to prove the full order: initialize response, required advertised Agent-method selection, one successful authenticate response, optional model discovery, ready publication, then session/new or load. Hold the authentication response and require zero model-discovery/session requests and no ready admission; release it and observe the ordinary path. Missing, duplicate, Terminal and unknown method kinds, provider rejection, malformed response, deadline expiry and shutdown must fail/settle without session creation or prompts. Verify explicit Claude/Standard NotRequested policy sends no authenticate request and retains their current startup behavior. The provider policy has no I/O or native/MCP dependency. New Rust unit bodies remain sibling `_test.rs`; real wire ordering uses the existing permanent integration harness, not a temporary driver or another provider server.\n\nThe retained direct Cursor reference is supporting evidence only: it records cursor_login in offered IDs and successful JSON-RPC authentication, with zero sessions/prompts; it omitted the method discriminator/full response and used JSON-RPC/Zod checks rather than typed Rust. It cannot replace the actual runtime validation or a complete M1 journey. On the combined repair tuple, observe actual Cursor initialization through the normal runtime, then repeat M1's original CLI/wterm model-only gate for both providers with independent model/effort readback, config guards and owned settlement. Preserve the prior Claude observation at its original source identity; it does not qualify changed initialization code automatically. No owner re-login, credential manipulation, diagnostic prompt, guessed authenticated status or weakened setup/error oracle is part of this proof.\n\n### A — Rules and native transport\n\nUse the existing native facade and controlled session ports/ACP peer. Cover the exact default-save positive family, every other config intent and mixed/file/version countercases. Verify that unknown methods, malformed input and deliberately unavailable features retain their distinct handling and no unintended effect.\n\nFor submitted input, publish actor events before the worker response and reverse that order. Exercise text, selected skill, multiple text blocks, text-plus-image, media-only, two equal-text submissions, wrong correlation, two connections, queue refusal and reset. One admitted input has one receipt; the correlated live view retains original content while ordinary history contains only its defined text summary.\n\nFor steering, distinguish Injected, StartedNewTurn, PromptRequired, failure and unknown effect. Interrupt after confirmed accepted steering; it must not restore or resubmit that input. History must retain it inside its original observed turn after the terminal event, not just while running.\n\nR7's expected-turn condition needs a real Host-port-to-actor countercase too. Hold a native A steer after its successful snapshot check, complete A and wait for its durable prompt settlement, admit/start B through the authorized Supervisor path, then release A. Require no B provider injection or accepted receipt under that original request; returning A's ID alone is insufficient. Do not leave A Unknown and mistake higher admission refusal for actor-target enforcement. A narrowly scoped test-only held port boundary is needed if the existing harness cannot stage that exact interval; it is not currently claimed as implemented. Keep same-turn, idle/missing, current-session and native retry/new-turn requests distinct, and qualify the remaining outcome mapping before declaring M2 steering complete. This is a planned source-countercase, not a public runtime reproduction or an M1 gate.\n\n### A1 — Model-only selection preserves provider effort\n\nFor U3/U4 and R3/R5, enter the existing native facade with the complete catalogue-qualified family in Program Design. First demonstrate the old refusal, then require success only after an actual model setter, no adapter effort write, and provider-confirmed model/effort state. Start with model A/high and a target B with a saved low value, so an inherited-high write cannot pass. Read back B/low, verify the saved value is unchanged, and preserve the existing next-turn check. A success receipt alone, a fake first-request ACK or a later request repairing an earlier error fails this oracle.\n\nExercise both target classes: ProviderSettings and a qualified Select target whose choices contain low but not the inherited high hint. The Select case must fail the old build's model-then-rejected-effort path, then observe actual model application, no first-request effort write, unchanged saved low and truthful readback. A paired allowed case whose target advertises high must retain the existing actual high write; blanket delegation of all Select values must fail. Omitted/null Select hints retain qualified default behavior. A later explicit offered low request may write low normally. Record the actual provider catalogue at qualification: absence of a differing Select row limits real-provider coverage, not this permanent controlled countercase.\n\nCover omitted and null top-level effort, the permitted nested hint forms, and an alternate supported model ID. Keep explicit numeric top-level effort with a matching numeric mask on a ProviderSettings row refused before effects; conflicting top/mask effort retains existing precedence. Keep mask-only numeric requests, conflicting models, malformed/empty/NUL values, reserved/unknown IDs, Plan, developer instructions, serviceTier including null, other unsupported controls, sparse effort and model-application failure/uncertainty on their existing contracts. Explicit invalid Select effort retains its truthful existing partial-effect/failure result; no new atomicity or rollback is claimed. Distinguish the first standalone request from the two-request pair. Two independent model requests may reassert the model; do not demand exactly one model write across the pair. Keep zero inherited-effort writes on recognized first requests, zero effort writes for a ProviderSettings pair, unchanged saved provider values, and zero additional default-save effects distinct.\n\nReuse the permanent Host native-to-controlled-ACP model fixture and colocated decoder cases. Extend the existing TypeScript original-client/wterm route for the captured regular-primary producer, retaining the whole-run settings-error oracle and actual provider observation. These are lasting checks. The controlled peer proves the selected translation and wrong-build sensitivity; it is not real Cursor qualification and cannot reconstruct an earlier unretained packet. After the correction, qualify actual Claude and Cursor on the final combined source/build/provider tuple under route B. At least one actual journey must exercise the changed family when the qualified catalogue offers a reachable target: select a different actual ProviderSettings model from a non-provider current effort, and retain the native first request's top-model/null-effort/matching-mask fields, target-row qualification and successful result. Merely sending the same shape to a Select row that offers the inherited value proves its preserved path, not this changed branch. If only preserved paths were observed, keep their valid evidence and require one additional targeted journey; do not repeat both providers or add unrelated variants. If no changed-family target is available, report the exact proof-applicability gap rather than infer coverage. No real model prompt is added; the permanent controlled next-turn case remains separate.\n\nKeep proof boundaries distinct. The controlled ACP wire and frozen decoder/application source decide zero adapter effort writes. The actual journey decides qualified branch input, success without early settings/default-save error, real model change, provider/native current-state agreement and owned configuration/lifecycle settlement. A ProviderSettings target may legitimately report high, another value or explicit absence after its model setter; do not infer an effort write from that value, require an invented low default, or require the previous model's effort to persist across models. The existing passive native-intent diagnostic does not observe outgoing ACP wire. This adds no diagnostic mechanism or weaker assertion.\n\n### B — Original client and actual provider\n\nExtend the existing TypeScript `capture-run.ts` route and existing `TerminalDriver`; retain original PTY bytes, wterm grids and PNGs. Add whole-run error tracking and styled submitted-row cardinality at the existing observation boundary. Show the new checks failing on the named pre-fix behavior before using them as proof.\n\nQualify Claude and Cursor separately. Use declared fixture skills and provider-owned effects absent from the typed prompt; read back the exact raw session and native alias. A picker, start receipt or generic reply is insufficient. Finish with actual quit/process settlement and the existing configuration guards. A manual test receives a verified live socket and an explicit lifetime, never a stopped allocation's socket.\n\nFor bounded M1, use the regular picker primary action that emits **PersistModelSelection**, with an actually advertised plain effort/default. Exclude session-only `s`, Max/Ultra advanced actions, reserve delegation and the Plan/all-modes scope prompt. At native `360319d8`, the regular event prints its exact **Model changed to {model}[ effort label]** info message only after the typed config receipt succeeds (`event_dispatch.rs:2563–2595`). Require one such logical info row after this run's apply action; repeated redraw frames are not multiple messages. Use exact whole-line/cell matching at a declared viewport where it fits, not substring matching: **for this conversation** is a different advanced-path message and is not this witness. The regular same-session catalogue/readback still decides effective model/effort.\n\nKeep raw native transport checks for the exact no-op receipt and zero additional command calls, including null and custom-effort values. The regular success-only UI witness establishes that the real client exercised persistence; the handler's type boundary and controlled transport establish that the extra batch invokes no provider setting. Normal selection may legitimately apply model and effort separately; A1's ProviderSettings family must not write inherited effort. The advanced branch saves only when default_effort is present and shares its conversation-change text with a skipped save; qualifying that branch later requires a same-connection record of the recognized batch and receipt. It is not an M1 prerequisite or a substitute witness. Preserve both red save-error and early settings-error sensitivity cases, and retain the complete whole-run error/lifecycle gates.\n\nFresh startup is a separate target variant: no `resume` subcommand, explicit provider-default model, one declared CLI-created session, complete public inventory before/after, and the actual CLI `/status` Session alias matching the acquired raw identity. Preserve the strict existing resume and Claude-isolation readers; do not relax them for fresh acquisition. No diagnostic model prompt is used to discover the session.\n\nFresh startup also needs a deterministic stale-result countercase. The current resume-only target and observer peer cannot stage it. Extend the existing TS transport/capture path with the PD's single-response hold and the already-required fresh target/whole-run frame ledger. Preserve the real bridge service/epoch/endpoint qualification even though the CLI connects through the declared control socket; do not qualify an arbitrary substitute socket as the bridge.\n\nHave the real bridge compute its earlier prebinding catalogue, hold that **response**, and witness the newer active catalogue's fixture row in the original CLI before release. After release, require the row to remain correct and compare the same bound catalogue through the independent observer. This stages a sufficient late-delivery countercase; it does not assert that every stale UI application needs late delivery. Equal catalogues on an ordinary resume cannot decide this case. Holding a request would cause a later fresh computation and is a false test.\n\nThe control forwards original message payloads and supplies no results. Bound it to one held response/connection/run, record capture/release and checkpoint identities, and settle sockets/waiters on failure, target change or allocation closure. Use the existing `ws` dependency and original wterm renderer; no fake complete native server, new provider or temporary test file. Its schema/launcher/checkpoint-release/lifecycle support must be implemented and checked before this test is runnable. Unit tests for those TS modules stay beside them.\n\nKeep the outcomes separate: whole-run red **No active thread is available** identifies the local active-thread gate; startup/refresh RPC error text identifies a failed read; loss of a previously witnessed `$` fixture row while the independent bound observer still has it identifies stale client state. A final frame alone can miss an earlier error, and observer agreement on an empty catalogue cannot prove stale overwrite. These tests provide sensitivity and qualification, not permission to choose a client change or to claim that the supplied screenshot's cause was reproduced.\n\nIf an earlier failure prevents the newer catalogue witness or held-response release, that run cannot count as stale-result sensitivity. Keep that case unverified; do not suppress errors or weaken the acceptance oracle to complete the stage.\n\n### C — Commands, facts and callbacks\n\nApproval proof starts with the real ACP permission producer and tool kind, crosses broker/native translation, and returns the exact offered option once. Once-only choices can use the appropriate native dialog; persistent or unrepresentable choices retain the form and every offered scope. Denial, cancellation and unauthorized viewers never produce the guarded marker.\n\nReview proof covers all four target meanings, real cwd, one input and actual turn handle, a known reviewed defect, unchanged reviewed files, busy refusal and fast completion. At the current pin a busy/refused admission has a caller-fatal negative RPC; observe that exit and no review effect as the known gap, not a recoverable pass. A G2 repair or explicit owner scope change is required before counting clean failure handling. No fabricated native review-mode events are expected.\n\nClaude title proof first qualifies the selected package/SDK/native executable and wrapper. Check normal non-AIR traffic, actual narrow capability, one provider control with no prompt/turn, canonical notification/readback, normalization, archived display, concurrent generation, clear/reset identity and next-turn/reopen persistence. Failed mutation or missing/contradictory readback retains uncertainty and its caller-fatal negative-RPC path; never count a successful title echo or documented exit as recovery. Re-run affected model/skill/input/callback controls after the package upgrade.\n\nInformation proof distinguishes source authority, unknown/empty and current/stale scope. Do not serialize original provider Session objects or credential-derived cache keys. Full native settings need authoritative values for every required field. A context parameter string, active-turn spend and current occupancy are not interchangeable. Initial unknown, null-capacity with real usage, and model-switch reset are different cases.\n\nSeparate provider facts from frontend stance. Check a broker-backed matching approver and a foreign/read-only approver, so a hardcoded interactive User claim cannot pass both. A label or optional profile ID must not pass as unknown enforcement: the native sandbox remains concrete, and changing the description does not remove its policy/selection behavior. If an actual facade policy is later selected, prove its exact scope and display without claiming it is observed provider filesystem/network enforcement. Native display/cache mutation and an actual provider permission change are different observations; normal turns can preserve permissions.\n\nFor context, inspect composer, `/status` and the configurable status line separately. With genuine complete usage and null capacity, `/status` omits capacity and the composer can show used tokens, while the status line can still fall back to client config. Retain the per-invocation omission where required. Initial no-usage and model-switch/reset are separate cases; do not make a green test by supplying invented zero breakdowns, a local Codex capacity or an aggregate/query spend value as occupancy. Missing native clear/unknown semantics remain a G3 contract gap, not a waived test.\n\nStartup proof rejects suppression-only notification fixes and unbounded deferred reads. Exercise early genuine watcher notifications and delayed background result application separately. A native socket test can prove the bridge does not deadlock; it cannot prove the unchanged client's internal task schedule. Whole-run fresh CLI observation remains required. The selected complete repair is still gate G4.\n\n### D — Shared execution and stronger contracts\n\nStart with the existing prompt path, not a new universal API. Use one declared session and three distinct input identities; do not submit the same prompt three times and call it deduplication proof. Correlate each actual turn with its entrypoint and the shared owner.\n\nObserve each frontend's own result boundary: native may return its correlated `TurnStarted` handle while the turn is still running; MCP returns an actual existing/admitted operation snapshot; standard incoming ACP must retain its response until the matching terminal event and update-ordering barrier. Hold the terminal event in the controlled peer to distinguish those outcomes. Do not use equal reply timing as the oracle or treat a start/submission as completion.\n\nKeep native selected-skill/rich-content meaning where supported. MCP's current public prompt is text; that explicit frontend limit must not downcast another path. Incoming ACP content remains constrained by the actual negotiated connection/profile; the internal parser's ability to carry a type does not advertise it to a standard client. The Host-internal request is not exported as a complete public contract. Check generation admission on the real MCP application path; the current immutable supervisor binding map is source evidence, not a runtime replacement-race result or a guarantee for a new ingress.\n\nExercise the session-level differences explicitly. For an unloaded target, observe the delivery route's permitted load behavior versus MCP's missing-runtime/not-submitted path; incoming ACP must have its actual observer/attachment preconditions, and a bare unattached prompt is a separate failure case. For concurrent route/MCP inputs, do not assume MCP took the route lock: inspect the actual busy/refusal and one-dispatch outcomes. For unresolved settings and unsupported content, require zero provider prompt dispatch through the shared lower guards on every applicable path. A supervisor-only fixture would miss those guards and could falsely report a bypass. These cases preserve existing contracts; no uniform auto-load or new authorization rule is implied.\n\nPreserve explicit MCP operation ID, binding generation, creator/requester, approver and requested policy. Exercise a stale generation, an unauthorized caller and an unavailable capability before effect. Detach a caller only under the declared custody contract, keep an authorized observer, and inspect actual settlement. This is not proof of last-subscriber loss, crash survival, Host replacement or another provider's process lifetime.\n\nWhere a frontend cannot represent a stronger result, its adapter needs an explicit mapping or must withhold the offer; it cannot claim that ACP request IDs supply durable operation recovery. Exact-turn cancellation must be decided at the effect owner against that target, including the boundary race with a later turn.\n\nFor the selected actor-owned cancellation sequence, distinguish two real boundaries. Through the **Supervisor plus real Host port/broker**, hold a live cancellation in cleanup and require B to fail **at admission** with Validation/Busy/effect None naming the blocking cancel operation, before runtime dispatch. Busy alone is insufficient: the lower actor could also refuse after the fence was bypassed. Removing/bypassing the higher fence must fail this oracle. Do not force B through it and label that a current public Host reproduction. Separately use the **direct runtime API plus real Host port/broker**, with a held port wrapper injected through the existing InteractionPort seam, to expose actor-local ordering without the higher fence masking it. This test-only wrapper adds no production seam or storage change.\n\nAt the appropriate boundary, stage exact A after B already has pending approval and question; A's paired inspection before B replaces it; lower-level A cleanup held mid-sweep while A becomes terminal; and Cancel queued during output-limit cleanup. Assert no B token/history/provider-cancel effects, no lower-level admission of B during actor-owned A cleanup, sequential/idempotent repeated A cleanup, and no untracked-exact fallback to current cancellation. Keep the Supervisor fence and actor-local invariant as distinct oracles. The old late-cancel case alone covers neither early capture/delayed cleanup nor actual Host history.\n\nWhile the actor waits for cleanup, complete each real callback kind through its connection-spawned path: permission, Cursor question, Cursor plan and form elicitation. Check response enqueue before provider cancel enqueue, exact-ID settlement for callbacks admitted during cancellation, no pending orphans, and preservation of retirement/terminal/overflow cleanup. A dropped frontend waiter after admission does not cancel the owned work. Stage these orders with held doubles/signals and bound the test wait; elapsed time is not readiness. Colocate new Rust unit cases in sibling `_test.rs` and extend existing Host/TypeScript-wterm integration journeys.\n\nRecord native interrupt RPCs individually. A mismatch may make the original CLI send a second, separately admitted B request; per-request exactness and whole-action retargeting are different checks. Hold cancel settlement after admission: no native success yet. Then allow CancelRequested but hold A's terminal: native success and quit exit must still wait. Release A's actual ending and verify the reply/exit and no post-exit effect from that targeted turn. Preserve ordinary completion racing cancellation without inventing an abort; an independent later B is not part of A's cancellation/cessation claim.\n\nWhile A's terminal is held after CancelRequested, immediately Enter/steer and change model/settings. Their actual applicable outcomes must finish independently of the pending interrupt reply and keep the CLI responsive. Observe ordered admission, the explicit immediate/deferred response shape and one socket writer. Disconnect with a deferred reply outstanding: its existing task owner settles/aborts the observation, while admitted work remains owned. Deadline expiry, Lost, stream gap/closure and epoch reset cannot yield false success or quit exit; use a controlled clock for the one shared 30-second native budget. Missing/unloaded must be distinct from Idle before the native empty-ID no-op. Standard ACP keeps its cancellation notification semantics and MCP its durable operation result. Side-close and safety-buffer cases remain source-only unreachable controls under current dispositions.\n\nQualify unknown terminal reasons explicitly: the current incoming projection maps an unknown reason to `end_turn`. Retain the original domain/operation observation and report that mapping's limit; its wire value alone cannot prove the provider's original reason was known. No new repair or public schema is selected by this observation.\n\n## E — Complete incoming/outgoing interface qualification\n\nThese are planned lasting observations for the new R16–R22. The current project recipe covers the original CLI and typed callbacks; it does not yet provide a complete metadata-free bound-ACP journey. Build that lasting recipe entry and TypeScript driver before using it as evidence. All authored scripts run under the repository's Node/pnpm path; Bun is claimed only after its same gates are qualified. Reuse the existing Rust production Host/integration fixtures and PTY/wterm capture, not another native server, agent engine or terminal renderer.\n\n| Row / reference | Target, entry and observation | Pass condition and wrong build | Reuse / limits |\n| --- | --- | --- | --- |\n| U10; R16; V16 | Needed: standard ACP v1 driver → actual owner-private bound listener → production route/Host → controlled ACP peer, then actual Claude and Cursor separately | No Router metadata; real create/list/load/resume/prompt/cancel and offered config/mode/close work. Equal raw IDs never cross routes. Missing Codex route admission does not prevent the qualified provider facade from negotiating/dispatching. Default-Codex, metadata-required or mandatory-unused-native-dependency builds fail. | Existing listener/route and Host fixtures supply production wiring, not complete end-to-end coverage. Actual credentials/runtime access are required only for declared runs; no universal-agent or Host process-split claim. |\n| U11; R17; V17 | Registration/constructor checks plus generic driver through the same listener/runtime with a standards-only peer | One registration/rule implementation; frontend code unchanged. Required authentication, malformed initialization or unsupported profile fails availability before session work. | Pure behavior/source checks plus controlled wire. Actual named backend qualification remains separate; a fake peer is never a real-provider result. |\n| U4/U8/U10/U11; R18; V18 | Initialize/setup/config/update response through the real active inspection port, matched to the same backend/session/client profile | Original config IDs/kinds/current values reach setup and updates; unsupported categories are not mutable offers. An active read cannot silently use the Host-memory last-recorded fallback. Native/MCP may retain that fallback under their existing contract; do not demand cross-frontend equality against an unavailable active read. Known-empty differs from unavailable; read loss after a confirmed write cannot fabricate success or erase its effect. Parser-only/fixed-backend/guessed-default builds fail. | New port/projector cases keep actual Host/runtime observation; controlled retirement/read-loss order plus actual provider readback. Existing native G3/G4 remains separate. |\n| U8/U10; R19; V19 | Same real Host session, distinct native/MCP/ACP inputs, causal held terminal event and caller detachment | Native turn-start and MCP snapshot retain their meaning while ACP v1 waits for matching terminal plus update barrier. Release the terminal, then see its real stop reason. Lost/stream gap is not success; no duplicate dispatch after caller loss. | Existing shared prompt route D, extended to the metadata-free profile. Does not claim cross-Host crash durability or ACP v2 support. |\n| U4/U8/U10; R20; V20 | Actual permission/question producer → real broker → incoming callback → exact selected reply → guarded provider effect | Only the intended approver's offered choice settles once. Wrong actor, duplicate/late reply or absent persistent acknowledgement cannot grant. Unsupported form is explicit and pending; the existing authorized alternate answer path remains available. | Existing typed-callback recipe and broker/runtime cases, extended through new profile. Controlled causality plus separately declared actual callback qualification; no persistent grant by default. |\n| U7/U8/U12; R21; V21 | Existing Host queue through its real command owner/ACP extension and an independent application consumer; inspect permitted MCP exposure separately | Same input identity/target and actual queue state, actor checks intact, no provider-native queue claim. A feature that bypasses admission or sends its own raw provider prompt fails. | No new task API/engine. A controlled consumer proves the dependency boundary only; it cannot qualify a future task feature. |\n| U1/U6/U7/U9/U11; R22 | Production dependency view/module-cycle gate, full test discovery, actual original CLI/reverse preservation and data-owner inspection | No new provider-specific frontend switch, store or upward dependency; units colocated. Existing conversation create/prompt on both external endpoints still select ExternalProvider after the bound sockets exist; Codex advertised ACP and each provider-bound stdio entry negotiate through their intended unchanged/new path. Escaped or missing bound paths fail without Codex fallback. Native/M1 and reverse behavior still hold after integrated changes. Fleet ownership and shared composition pass F1–F4 below on the admitted source base. | Reuse unchanged M1 evidence only after source/build/provider dependencies are shown equivalent. Changed routing/authority/projection requires its affected real interaction again. |\n\n### Client MCP setup within V16/V18\n\nThrough the real bound listener, session command port, Host composition and outgoing ACP runtime, supply `mcpServers` on new, cold load and cold resume. Observe the exact resulting provider request: the Host-selected collaboration entry is preserved and each client's stdio/HTTP/SSE configuration reaches only its requested session. Empty client input leaves the Host entry intact. Stdio needs no HTTP offer; HTTP/SSE are offered and exercised only where supported. An already active session with unchanged known setup attaches; changed or unknown setup and a changed required Host binding refuse before replay or provider work. Invalid shape, unsupported transport, duplicate name and reserved collaboration-name collision likewise have no provider effect. Concurrent sessions with distinct lists cannot inherit each other's tools. Original native/MCP callers retain HostDefaults; the existing Router-aware Codex MCP path remains a preservation control.\n\nKeep permanent cases for every new/load/resume branch, including active attachment, authorization failure, caller loss after submission and cold restore with a freshly supplied list. A native/MCP-created active HostDefaults session must accept bound ACP load and resume with `[]`, with no provider work; a different non-empty list refuses without effects. Unknown legacy active setup is distinct from this known empty list. Retire the actor, restore through HostDefaults and through a newly supplied client list, and observe the documented non-persistence consequence and unchanged Host-owned session binding. The binding is not copied into client tool configuration or echoed back to the ACP client. Wrong builds that drop non-empty lists, filter stdio through HTTP support, overwrite the collaboration binding, mutate global defaults, report unapplied active changes as success or log headers/environment/URLs must fail. Existing known/unknown lifecycle outcomes remain truthful; provider acceptance alone is not evidence that a tool connected.\n\nQualify the actual supported provider/tool path separately: a small TypeScript MCP fixture with no real credentials records an actual agent connection and tool call, through the production bound frontend. Observe that connection and its result on the correct session; a stand-in ACP peer or inspection of the outgoing JSON cannot pass this part. Use the declared provider allocation and prompt budget, never opportunistic extra prompts. Unsupported provider transports remain explicit negative cases. This proves session setup, not Fleet enrollment or bearer-address minting. No new token/registrar/storage mechanism is built for this test.\n\n### Fleet boundary preservation for R13/R18/R20/R22\n\nThese observations decide B's compatibility with the Fleet version on its actual implementation base. They do not qualify unfinished Fleet features or commission a new Fleet harness. Use the existing production Host, real mail/session/interaction owners and controlled external ACP peer for causal cases. Keep actual named-provider qualification separate.\n\n| Observation | What is checked and the deciding failure | Boundary and limit |\n| --- | --- | --- |\n| F1 Source and constructor ownership | Compare the adopted main/Fleet/B heads and actual module dependencies. Frontends receive ports, the current Host still builds mail/interaction/session owners once, and B introduces no store, migration, mail transport or identity writer. A build restoring an obsolete Fleet constructor or moving custody into an ACP adapter fails. | Source/dependency/compile evidence; no claim of live cross-machine delivery. Record adopted contract and active writer/landing order before edits. |\n| F2 Shared Host causality | Through the existing Host/mail integration path, hold the session hand-off or matching provider terminal while the bound client is attached. Observe mail receipt/hand-off and provider operation/ACP completion separately; release the real held boundary. Close/fail the bound connection and verify existing mail owner/transport and admitted session work retain their specified ownership with no automatic second dispatch. | Production wiring with the existing controlled ACP peer, not a mocked mail runtime or a new remote server. A mail ACK or ACP stream closure alone cannot pass. Use only a mail kind already implemented on the base. |\n| F3 Identity and role preservation | New/local discovery, exact full SessionRef, stored creator/Approver and actual effect authorization agree across existing native/MCP/ACP entrypoints. Same opaque ID on another endpoint cannot route. If Fleet's canonical machine-id cutover is present, the actual current-ID/rejected-old-ID contract is retained; otherwise that future cutover is explicitly unexercised. | Reuse identity/authority converters and existing owner fixtures. No test-driven introduction of a RemoteRequester kind, alias, migration or new permission mechanism. Wrong-actor denial and no effect remain required on every base. |\n| F4 Implemented remote features remain distinct | If D2 remote create is present on the admitted base, reuse its existing command-owner replay/authority/first-input tests and check that attaching B's frontend does not change their recorded request/operation/roles or cause a duplicate create/prompt. Otherwise record D2 as not on the base, preserve the rich-operation source contract and make no remote-create pass claim. | This is preservation of an existing Fleet capability, never a requirement to build D2 or run its whole staging program for B. A local convenience create or synthetic success cannot stand in for remote admission. |\n\nR22 closes only when F1/F2 and the applicable F3/F4 preservation cases pass, their absent capabilities are named, and no B change bypasses an adopted Fleet invariant. D3/D4 storage/cutover work remains its owner's proof. A controlled case earns its wiring boundary; it cannot establish live Fleet durability, staging behavior or universal agent interoperability.\n\nEach actual journey declares source/build/client/protocol/provider tuple, endpoint/session/operation scope, allowed actions, immutable lifetime and owned cleanup through the project recipe. Use controlled peers for exact order/failure sensitivity and actual providers for interoperability; never combine their observations into a false live wire/durability claim. Record normal configuration guards, actual readbacks and cleanup even on a failed run. No production restart, install, new account, broad storage read or credential manipulation is implied.\n\nPure profile/offer rules use a table over valid/invalid inputs. Connection sequencing uses held replies/barriers rather than sleep. The wrong-build sensitivity cases are the current metadata-required/default-Codex profile, raw-ID last-writer routing, fixed capability advertisement, early ACP prompt completion and persistent-choice consent invented by an adapter. No UI screenshot alone proves any of those. Original CLI visual claims still use real wterm frames and whole-run errors; protocol outcomes use exact schema/result/event evidence.\n\n## F — Ordinary MCP facade qualification\n\nThis route earns R23/U13 while retaining R12–R14/R19/R20 and actual CLI preservation. It observes the facade, not ACP frames inside MCP. There is no tunnel test stream. The first deliverable qualifies text/session lifecycle; the complete inventory keeps other facade gaps visible without claiming them implemented. Tasks, messages and connection liveness cannot stand in for an accepted task result.\n\n| Row / reference | Real target and observation | Pass condition and wrong build | Boundary / reuse |\n| --- | --- | --- | --- |\n| U13/U2; R23; V23 coverage | Locked ACP method/callback/qualified-extension set, actual MCP tool discovery/schema and the selected endpoint/session facts, compared with the maintained verification inventory | Every member has its mapping or explicit unsupported/unqualified disposition; claimed support traces to the real supplier and a deciding proof. A removed/new method, omitted reverse callback, guessed positive or duplicate runtime registry fails. | Inventory is verification data; reuse current schema/tool registration. It does not expose every SDK method or mutate provider state. |\n| U13/U8/U6; R12/R13/R19/R23; V23 lifecycle | Real Streamable HTTP MCP client → production MCP/application/Host/supervisor → outgoing runtime → controlled ACP peer, with real hub/operation readback | Create/load/resume/prompt/close target the same exact endpoint/session; requester/Approver/generation and operation identity remain intact. Peer-held outcomes distinguish pending from terminal. A scripted application success with no runtime dispatch, wrong target or synthetic terminal result fails. | Existing HTTP scripted-backend cases remain narrower controls. New owning integration cases keep the actual Host/runtime chain; controlled peer replaces only the external agent. |\n| U13/U4/U6; R8/R19/R23; V23 output | Bounded observation baseline, actual input and subsequent epoch/sequence continuation through MCP; independently inspect matching session/operation | Capture the reconstructed item/output and terminal facts for the exact turn without mixing another session. Notifications agree with their bounded result. Wrong epoch, resync, oversized-event and disconnection are explicit; native no-cursor semantics remain separate. A lost first item, fabricated cursor, treating every `continuationGap:true` as loss, or passing output from another operation fails. | Use existing hub snapshot/receiver and cursor contract. This does not claim lossless replay of every intermediate delta or cross-Host durability. A controlled live case can hold the peer until the actual existing attachment is observed; no new product ready notification is required. |\n| U13/U8; R7/R13/R19/R23; V23 caller loss/control | Hold the real terminal or exact cancellation boundary; cancel/drop an MCP waiter, then separately request explicit cancellation and release the held boundary | A lost waiter detaches without redispatch or implied work cancellation. Explicit cancellation retains its qualified target and actual settlement; a stale older cancellation cannot affect a later unrelated input/session. Wrong actor/target refuses without unintended effect; unknown outcomes remain inspectable and are never automatically retried. | Preserve existing effect-side cancellation fences and call-local tool cancellation. An ACK, caller exit or shared socket shutdown cannot prove cessation. No new cancellation coordinator. |\n| U13/U4; R18/R20/R23; V23 settings/interactions | Existing MCP setting, inspection and approval/question tools through actual command/catalogue/broker owners; compare actual option/choice and stored roles | Existing calls remain valid; declared support is scoped, offered IDs/values and exact approver settle once, unsupported types do not become success. A schema-only option, unauthorized decision, defaulting to a Human actor or invented persistent consent fails. | These preserve existing qualified controls; unimplemented rich config/setup/media mappings remain named unqualified rows until their owning contract/driver is realized. No raw config passthrough. |\n| U1/U6/U13; R1/R10/R12/R23; V23 real providers and CLI | Actual declared Claude and Cursor allocations, one real ordinary MCP client plus the unchanged Codex CLI on the final source/build/provider tuple | Separately retain real MCP inference/output/terminal and same-conversation resume/reply; real Codex CLI inference turns over each provider socket with exact session/turn IDs, original PTY/wterm evidence and same-session MCP readback. Actual effects/readback agree, no hidden red errors, duplicate user row or guessed completion. A model-picker-only run, catalogue success, old screenshot/session ID or controlled peer cannot pass. | Normal signed debug artifacts, exact roots/effects/prompt budgets/deadline/cleanup owner. Existing native/reverse controls remain. Missing access or capability is unobserved, never a pass or an invented exclusion. |\n\nBuild the lasting TypeScript MCP lifecycle driver and update the project verification recipe before using it as evidence. Its `--check` equivalent validates inputs/apparatus without launching a provider. Sensitivity cases must fail wrong-target, falsely completed, truncated and replayed-submission observations; a frame of the last state alone cannot decide those. Reuse the same renderer/Host and existing isolated-runtime allocation instead of another harness service. Unit tests are permanent and colocated; external scripts use Node, with Bun claimed only after the same gates are qualified there.\n\nDeclare the first-PR driver's truthful caller: the existing local operator Human identity or an actual hosted requester session. Never borrow a session ID merely to pass today's public prompt/cancel schema. Permanent producer/consumer cases cover Human create → prompt → exact cancel/close through the real application, the unchanged SessionRef wire input, native Human refusal before dispatch and provider composite creation/prompt with separate operation IDs. Declared wrong-role cases exercise existing role checks; they claim no authentication of supplied identities. The actual run uses its declared operator identity from the owning source and verifies requester passage and stored creator/Approver at their respective owners, as described below. If a Fleet binding is on the admitted base, preserve its existing bound-session versus unbound-operator attribution tests without implementing that binding for this facade.\n\nKeep the existing Session-requester/`HumanUser` content cases. The current API leaves reported content-author/requester pairing unchecked; do not introduce an equality guard or count contradictory sender data as successful identity proof. The real operator uses `HumanUser`; the hosted-agent driver uses its own requester/sender. These observations establish the declared identity/role contract only, not authenticated authorship.\n\nThe first lifecycle PR closes only its named V23 rows/targets and affected preservation controls. A full-facade claim additionally needs every required mapping in the inventory qualified by its corresponding operation/input/callback proof. Neither the first PR nor static tool registration closes the broader CLI G2–G4 gaps or the separate bound-ACP V16–V21 implementation.\n\nFor the exact correlation asserted in this first isolated journey, use one new case/session, a real baseline, one known operation and one matching post-baseline input/turn chain. Require terminal output equality and an independent peer receipt with exactly one prompt. Additional inputs/operations/turns fail that isolated oracle. Public operation snapshots currently omit the input/turn link, so do not claim a public concurrent join or fabricate one in the driver. Read session creator/Approver fields from the existing owning record in the declared private allocation, read-only with correct live WAL handling or immutable after shutdown; never infer the stored roles merely by echoing submitted data.\n\nDistinguish the initiating operation requester from the stored session creator/Approver and from a broker requester's provider-session identity. Capture the exact typed requester at the real application/backend boundary, inspect its actual runtime passage, and read the stored roles from their owner; none of those identities is an interchangeable substitute for another. Concurrent streamed-output attribution remains an explicit first-PR gap.\n\n## Test changes and quality\n\n| Existing check | Keep or change |\n| --- | --- |\n| Original native/reverse and lifecycle controls | Keep; run on the final declared tuple. |\n| Model default-save journey expecting refusal | Repair to expect the recognized no-op, no red error and no extra effect. Keep negative native write cases. |\n| Image oracle rejecting every user receipt | Repair to match the admitted receipt identity/text-summary contract and original live media representation. |\n| Ordinary-reply oracle assuming one user item per turn | Repair for distinct accepted steer IDs inside one observed turn. |\n| Startup capture that only inspects final frame/resume | Extend for actual fresh creation and whole-run errors; keep existing resume checks. |\n| Callback fixture already normalized to lowercase | Keep any useful decoder test, but add the real producer-to-consumer path so the original mismatch fails. |\n\nNew unit tests are permanent and colocated. Authored drivers are TypeScript; Node is the declared runtime and Bun support must be qualified before being claimed. Existing Rust PTY/protocol fixtures remain Rust. No new renderer or temporary test files.\n\nUse the [project verification recipe](../../../.agents/skills/verify-codex-router/SKILL.md) and its actual source-bound journeys. The delivery plan schedules these routes; its estimates do not waive them. Package check commands and gate ownership are on that page.\n\n## Current limits\n\nG1–G5 in Program Design are not implementation results. In particular, full ACP exposure, exact-turn cancellation, the Claude upgrade, complete information projection and startup repair are unqualified. A bounded source review or a controlled fixture is reported as such; it does not close an actual-provider obligation.\n","reference":"./verification-design.md"}</script></ex-markdown>
