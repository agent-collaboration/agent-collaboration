<ex-markdown id="delivery-choice" label="Boundaries"><script type="application/json" data-ex-markdown-source="">{"text":"# The boundaries of this work\n\n**Change Router's translation. Use each provider's existing setup and native capabilities.** No provider changes, upstream ACP changes or extra runtime machinery.\n\n```mermaid\nflowchart TD\n  Codex[Existing Codex UI and requests]\n  Codex --> Router[CHANGE: Router discovery and input translation]\n  Router --> Provider[Existing provider and ACP runtime]\n  Provider --> Setup[Provider owns its setup and execution]\n```\n\n## Router may change\n\n- Answer existing skills/plugin discovery requests with truthful metadata from the selected provider's existing exports or qualified own files.\n- Resolve the submitted native identity in the actual workspace/setup, then translate supported selections into existing native input.\n- Reject unsupported selections explicitly, expose existing command metadata, and preserve live/history behavior.\n- Add permanent regressions and extend the existing project verifier for real installed-client/provider proof.\n\nThese are bounded changes in existing Router/Host owners. Small private parsing/validation functions and types support those changes; they are not a separate capability platform.\n\n## Each provider continues to own\n\nInstallation, enablement, configuration, precedence, native skill expansion, plugins, tools, hooks and execution. Router reads and translates; it does not install, enable, copy or emulate those capabilities. No global setup mutation.\n\n## Outside scope\n\n- Changes to Claude, Cursor, other providers or their ACP adapters; forks or patches of installed executables.\n- Upstream ACP extensions, new provider contracts, and Codex client changes.\n- A registry, new Host catalogue cache, background refresher, scheduler, daemon, plugin manager or replacement execution engine.\n- New public APIs, persisted selection/catalogue formats or database migrations.\n- Production process/settings/socket changes, unrelated lanes, release or installation work for this design cycle.\n\n## What happens when the existing route cannot do it?\n\nReport the exact provider/version and missing behavior as **unsupported**. Keep uncertain behavior **unqualified** until tested. Neither a displayed name nor a successful ordinary reply proves native selection. Do not expand scope or mark all-provider support complete.\n\n- **Cursor plugins:** the inspected ACP build lacks its normal plugin runtime. Execution is unsupported here; Router will not implement the missing runtime.\n- **Claude:** one native skill input format works. Complete discovery, general selection resolution and plugin intent still need qualification through existing capabilities.\n- **Provider `/` commands:** ACP already enumerates them and Router has text invocation. Arbitrary provider entries in Codex's slash menu remain a client limitation outside this work.\n- **Consumer metadata:** Codex's existing defaults for undeclared plugin policies may be shown as explicitly attributed Codex display defaults; they do not establish native auth/installation behavior or grant management actions. Unobserved policy never receives a default. If entries cannot fit truthfully, use existing errors, including a whole-method error where partial reporting would need a fake path. No fabricated native origin or enablement.\n- **Filesystem lists:** Codex's skill/plugin lists represent actual skill files and installed filesystem packages. Confirmed bundled skills and loaded-only builtins are outside those views; they do not make a mixed Claude filesystem list fail. Path-less `$` selection is unsupported. Unresolved origin or a failed in-view read is an error, not permission to hide the entry as a builtin.\n\nThe reference launch uses the existing per-invocation `features.mentions_v2=false` setting for `$` skills/plugins; it does not alter global configuration. The actual chooser experience still needs installed-client proof.\n\nThis boundary records the owner's latest scope instruction. It is not a claim that the follow-up is implemented or that every requested experience is supported.\n","reference":"../../../tmp/design-workflows/2026-10-23-provider-owned-capabilities/decision-brief.md"}</script></ex-markdown>
