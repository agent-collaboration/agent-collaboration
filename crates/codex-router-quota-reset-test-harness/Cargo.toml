[package]
name = "codex-router-quota-reset-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "codex-router-quota-reset-test-harness"
path = "src/main.rs"

[features]
default = ["quota-reset-test-harness"]
quota-reset-test-harness = ["agent-collaboration/quota-reset-test-harness"]

[lints]
workspace = true

[dependencies]
agent-collaboration = { version = "0.1.105", path = "../agent-collaboration", features = ["quota-reset-test-harness"] }
codex-router-cli = { path = "../codex-router-cli", version = "0.1.4", default-features = false, features = ["quota-reset-test-harness", "keychain-test-support"] }
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
codex-router-core.workspace = true
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.4", features = ["keychain-test-guard", "test-support"] }
codex-router-state = { path = "../codex-router-state", version = "0.1.4" }
portable-pty = "0.9.0"
regex = "=1.12.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
