[package]
autotests = false
name = "collaboration-central-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
conformance = []
# Test seams (pause points, the storage conformance schema); never in a production build.
test-support = ["sqlx-core/migrate", "fleet-runtime/test-support", "fleet-storage-schema/test-support"]

[dependencies]
central-storage.workspace = true
central-engine-model.workspace = true
agent-automation = {path="../agent-automation",version="0.1.149"}
workspace-model.workspace = true
workspace-ids.workspace = true
workspace-rules = {path="../workspace-rules",version="0.1.149"}
serde_json_canonicalizer.workspace = true
fleet-identity-protocol = { path = "../fleet-identity-protocol", version = "0.1.118" }
schemars.workspace = true
axum = { workspace = true, features = ["json", "query"] }
http.workspace = true
fleet-runtime-ports.workspace = true
fleet-contracts.workspace = true
fleet-runtime.workspace = true
fleet-workspace-access.workspace = true
futures-util.workspace = true
sqlx-core.workspace = true
message-board = { version = "0.1.93", path = "../message-board" }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
base64 = "0.22.1"
url.workspace = true
uuid = { workspace = true, features = ["serde"] }
# Executor-independent sync primitives only, so the Worker build stays portable.
tokio = { version = "1.53.3", default-features = false, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "=1.26.0", features = ["v7", "js"] }

[dev-dependencies]
fleet-storage-schema.workspace = true
hegel = { package = "hegeltest", version = "=0.52.6", features = ["static-engine"] }
sqlx = { workspace = true, features = ["sqlite", "migrate"] }
ring = "0.17.14"
jsonschema.workspace = true
tokio.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
