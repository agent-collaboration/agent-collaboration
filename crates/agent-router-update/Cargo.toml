[package]
autotests = false
name = "agent-router-update"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "agent-router-update"
path = "src/main.rs"

[dependencies]
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime" }
message-board-storage = { version = "0.1.100", path = "../message-board-storage" }
codex-router-host = { version = "0.1.100", path = "../codex-router-host" }
codex-router-secret-store = { version = "0.1.102", path = "../codex-router-secret-store" }
codex-router-state = { path = "../codex-router-state", version = "0.1.4" }
interaction-storage = { version = "0.1.100", path = "../interaction-storage" }
sqlx = { workspace = true, features = ["sqlite", "migrate"] }
sqlx-turso = { version = "0.4.0", git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "b75d072c116afa46cfa82facd34db6317f380687", default-features = false, features = ["macros", "runtime-tokio"] }
fleet-sync-lease.workspace = true
fleet-sync-protocol.workspace = true
nix.workspace = true
chrono.workspace = true
clap.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile = "3.27.0"

[dev-dependencies]
agent-session-inventory = { path = "../agent-session-inventory", version = "0.1.105" }
codex-router-core.workspace = true
owned-process-test-support = { path = "../owned-process-test-support", version = "0.1.126" }
collaboration-central-tokio = { version = "0.1.100", path = "../collaboration-central-tokio", features = ["conformance"] }
collaboration-central-conformance = { version = "0.1.100", path = "../collaboration-central-conformance" }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
