[package]
name = "router-root-fixture-builder"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: the writers below are pinned to the Router release whose
# layout the update moves away from, so the fixture keeps the old code's bytes
# after this repository's stores change.
[workspace]

[dependencies]
message-board-storage = { git = "https://github.com/agent-collaboration/agent-collaboration.git", rev = "42a5ff53efe1f7cbd690b1ab3e2689e526355f51" }
message-board = { git = "https://github.com/agent-collaboration/agent-collaboration.git", rev = "42a5ff53efe1f7cbd690b1ab3e2689e526355f51" }
fleet-admission = { git = "https://github.com/agent-collaboration/agent-collaboration.git", rev = "42a5ff53efe1f7cbd690b1ab3e2689e526355f51" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio"] }
sqlx-turso = { version = "0.4.0", git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "84935efdab03615843611bb5723983d7655e6e26" }

[profile.dev]
debug = 0
incremental = false
