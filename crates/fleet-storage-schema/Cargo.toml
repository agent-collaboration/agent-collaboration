[package]
name = "fleet-storage-schema"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SQLx migration registries for Fleet central and workspace stores"

[lints]
workspace = true

[features]
test-support = ["dep:sqlx-core"]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate"] }
sqlx-core = { workspace = true, features = ["migrate"], optional = true }
