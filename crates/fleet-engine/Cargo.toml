[package]
name = "fleet-engine"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Fleet due work, attempts, and engine administration"

[lints]
workspace = true

[features]
test-support = ["fleet-runtime/test-support"]

[dependencies]
central-engine-model.workspace = true
central-storage.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["alloc"] }
fleet-contracts.workspace = true
fleet-runtime.workspace = true
fleet-runtime-ports.workspace = true
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
workspace-model.workspace = true

[dev-dependencies]
agent-automation = { path = "../agent-automation", version = "0.1.149" }
fleet-storage-schema.workspace = true
hegel = { package = "hegeltest", version = "=0.52.6", features = ["static-engine"] }
sqlx = { workspace = true, features = ["sqlite", "migrate"] }
tokio.workspace = true
