fleet-sync-delivery.workspace = true
fleet-sync-writer.workspace = true
reqwest-websocket = "=0.5.1"
futures-util.workspace = true
collaboration-central-conformance = { version = "0.1.96", path = "../collaboration-central-conformance" }
fleet-admission = { version = "0.1.96", path = "../fleet-admission" }
fleet-sync-receiver.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx-core.workspace = true
tempfile = "3.27.0"
tracing-subscriber.workspace = true

