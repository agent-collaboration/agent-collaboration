fleet-sync-session.workspace = true
reqwest.workspace = true
runtime-primitives = { workspace = true, features = ["tokio"] }
thiserror.workspace = true
tracing.workspace = true
base64 = "0.22.1"
ring = "=0.17.14"
collaboration-central-core = { version = "0.1.96", path = "../collaboration-central-core" }
durable-steps = { workspace = true, features = ["turso"] }
fleet-sync-tokio-runner.workspace = true
sqlx-turso = { version = "0.3.0", git = "https://github.com/agent-collaboration/agent-fleet-sync.git", tag = "v0.3.0", default-features = false }

[dev-dependencies]
collaboration-central-admin-protocol = { version = "0.1.96", path = "../collaboration-central-admin-protocol" }
chrono.workspace = true
message-board-storage = { version = "0.1.96", path = "../message-board-storage" }
collaboration-service = { version = "0.1.96", path = "../collaboration-service" }
board-fleet-sync = { version = "0.1.96", path = "../board-fleet-sync" }
