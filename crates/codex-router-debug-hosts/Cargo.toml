[package]
autotests = false
name = "codex-router-debug-hosts"
description = "Development-only debug Host launchers; never a dependency of a production crate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# The feature set the former codex-router-host examples (board-debug-runtime,
# debug_host_acceptance, imagegen-debug-acceptance, provider-only-debug-host) were
# built with: Host runtime test hooks, the Keychain test guard and ACP test
# observation. automation-debug-host runs without it, as the former normal bin did.
runtime-test-support = [
    "codex-router-host/runtime-test-support",
    "codex-router-host/keychain-test-support",
    "codex-router-secret-store/keychain-test-guard",
    "codex-router-secret-store/test-support",
    "acp-client-runtime/test-observation",
]

# test = false is unchanged from the former example and bin targets: the colocated
# unit tests under src/bin/ never ran there, and a move does not change proof.
[[bin]]
name = "automation-debug-host"
path = "src/bin/automation-debug-host.rs"
test = false
bench = false

[[bin]]
name = "board-debug-runtime"
path = "src/bin/board-debug-runtime.rs"
test = false
bench = false

[[bin]]
name = "debug_host_acceptance"
path = "src/bin/debug_host_acceptance.rs"
test = false
bench = false

[[bin]]
name = "imagegen-debug-acceptance"
path = "src/bin/imagegen-debug-acceptance.rs"
test = false
bench = false

[[bin]]
name = "provider-only-debug-host"
path = "src/bin/provider-only-debug-host.rs"
test = false
bench = false

[dependencies]
acp-client-runtime = { path = "../acp-client-runtime", version = "0.1.40" }
codex-native-integration.workspace = true
codex-router-host = { path = "../codex-router-host", version = "0.1.147" }
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.4" }
codex-router-state = { path = "../codex-router-state", version = "0.1.4" }
collaboration-client = { path = "../collaboration-client", version = "0.1.14" }
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime" }
futures-util.workspace = true
rustix = { workspace = true, features = ["event"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["io-std"] }
tokio-tungstenite.workspace = true
toml = "1.1.2"
tracing.workspace = true
tracing-subscriber.workspace = true
