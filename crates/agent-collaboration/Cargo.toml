[package]
autotests = false
name = "agent-collaboration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
quota-reset-test-harness = ["dep:sqlx", "agent-session-tui/quota-reset-test-harness"]

[[bin]]
name = "agent-sessions"
path = "src/bin/agent-sessions.rs"

[dependencies]
agent-session-inventory = { version = "0.1.105", path = "../agent-session-inventory" }
agent-session-tui = { version = "0.1.105", path = "../agent-session-tui" }
tokio-util.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
collaboration-client = { path = "../collaboration-client", version = "0.1.14" }
message-board = { path = "../message-board", version = "0.1.20" }
codex-native-integration.workspace = true
clap.workspace = true
crossterm = { workspace = true, features = ["osc52"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
sqlx = { workspace = true, features = ["sqlite"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "fs"] }

[dev-dependencies]
router-clock = { workspace = true, features = ["test-support"] }
agent-session-inventory = { version = "0.1.105", path = "../agent-session-inventory", features = ["test-support"] }
node-test-fixture = { version = "0.1.105", path = "../node-test-fixture" }
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime", features = ["test-support"] }
collaboration-contracts = { version = "0.1.105", path = "../collaboration-contracts" }
interaction-storage = { path = "../interaction-storage", version = "0.1.96" }
tokio = { workspace = true, features = ["test-util"] }
codex-router-test-support = { path = "../codex-router-test-support", version = "0.1.4" }
collaboration-mcp = { path = "../collaboration-mcp", version = "0.1.30", features = ["test-support"] }
claude-code-peer-messaging = { path = "../claude-code-peer-messaging", version = "0.1.37" }
jsonschema.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
uuid.workspace = true
codex-router-host = { workspace = true, features = ["runtime-test-support"] }
lifecycle-observation = { path = "../lifecycle-observation", version = "0.1.14" }
collaboration-service = { path = "../collaboration-service", version = "0.1.14", features = ["test-support"] }
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
tokio-util.workspace = true
futures-util.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
