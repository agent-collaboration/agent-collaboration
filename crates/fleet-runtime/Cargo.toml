[package]
name = "fleet-runtime"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "FleetRuntime execution shared by the central hosts"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
central-engine-model.workspace = true
central-storage.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["alloc"] }
fleet-contracts.workspace = true
fleet-identity-protocol = { path = "../fleet-identity-protocol", version = "0.1.118" }
fleet-runtime-ports.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["sync"] }
uuid.workspace = true
workspace-ids.workspace = true
workspace-model.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tokio.workspace = true
