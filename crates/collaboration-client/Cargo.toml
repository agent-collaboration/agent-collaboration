[package]
autotests = false
name = "collaboration-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
router-clock.workspace = true
reqwest = { workspace = true, features = ["json"] }
futures-util.workspace = true
http.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-unix-socket"] }
tokio-tungstenite.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
message-board = { path = "../message-board", version = "0.1.20" }
tokio-util.workspace = true
codex-native-integration.workspace = true
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
[dev-dependencies]
router-clock = { workspace = true, features = ["test-support"] }
codex-native-integration = { workspace = true, features = ["test-support"] }
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime" }
collaboration-mcp = { path = "../collaboration-mcp", version = "0.1.30", features = ["test-support"] }
codex-acp-adapter = { path = "../codex-acp-adapter", version = "0.1.30" }
collaboration-service = { path = "../collaboration-service", version = "0.1.14", features = ["test-support"] }
lifecycle-observation = { path = "../lifecycle-observation", version = "0.1.14" }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
