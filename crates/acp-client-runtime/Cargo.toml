[package]
autotests = false
name = "acp-client-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-observation = []
# Scenario tests only (design note §11.8): the in-process transport and the
# named-point hook. Enabled only from this crate's own dev-dependencies.
test-support = []

[dependencies]
agent-client-protocol.workspace = true
provider-session-machines.workspace = true
# The type of the child the ACP SDK spawns (provider_transport.rs).
async-process = "2.5.0"
futures-util.workspace = true
rustix.workspace = true
session-event-model = { path = "../session-event-model", version = "0.1.40" }
state-machine-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
acp-client-runtime = { path = ".", features = ["test-support"] }
hegel = { package = "hegeltest", version = "=0.52.6", features = ["static-engine"] }
# Client-level race scenarios (design note §11.8); dev-only, never a normal dependency.
turmoil = { version = "=0.7.2", features = ["unstable-barriers"] }
codex-router-test-support = { path = "../codex-router-test-support", version = "0.1.4", default-features = false }
tempfile = "3.27.0"
tracing-subscriber.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
