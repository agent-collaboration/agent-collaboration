# The driver's scenario Worker: each scenario runs inside a real SQLite-backed
# Durable Object under workerd (verification/targets/workerd-central.ts).
[package]
name = "sqlx-durable-object-test-worker"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
sqlx-durable-object = { path = "../.." }
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "macros"] }
worker = { version = "0.8.7", git = "https://github.com/cloudflare/workers-rs", rev = "b171cb4bdd6fa943bb81f429df0a6b0df37e14b3" }
wasm-bindgen = "=0.2.129"
serde_json.workspace = true
futures-util.workspace = true
