[package]
name = "codex-router-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codex-router"
path = "src/main.rs"

[features]
default = []
quota-reset-test-harness = [
    "keychain-test-support",
    "codex-router-quota-service/quota-reset-test-harness",
    "codex-router-quota-tui/quota-reset-test-harness",
]
keychain-test-support = [
    "codex-router-secret-store/keychain-test-guard",
    "codex-router-secret-store/test-support",
    "codex-router-host/keychain-test-support",
]

[lints]
workspace = true

[dependencies]
codex-router-quota-service = { version = "0.1.105", path = "../codex-router-quota-service" }
codex-router-quota-tui = { version = "0.1.105", path = "../codex-router-quota-tui" }
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime" }
base64.workspace = true
chrono.workspace = true
codex-router-auth = { path = "../codex-router-auth", version = "0.1.4" }
codex-native-integration.workspace = true
codex-router-core.workspace = true
codex-router-host.workspace = true
codex-router-proxy = { path = "../codex-router-proxy", version = "0.1.4" }
codex-router-selection = { path = "../codex-router-selection", version = "0.1.4" }
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.4" }
codex-router-state = { path = "../codex-router-state", version = "0.1.4" }
collaboration-service = { path = "../collaboration-service", version = "0.1.96" }
collaboration-central-core = { path = "../collaboration-central-core", version = "0.1.96" }
collaboration-central-tokio = { path = "../collaboration-central-tokio", version = "0.1.102" }
fleet-sync-protocol.workspace = true
fleet-sync-lease.workspace = true
fs2.workspace = true
uuid.workspace = true
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
message-board = { path = "../message-board", version = "0.1.20" }
clap.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
indicatif.workspace = true
iocraft.workspace = true
codex-router-tui.workspace = true
nix = { workspace = true, features = ["event"] }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["event"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[dev-dependencies]
codex-router-quota-service = { version = "0.1.105", path = "../codex-router-quota-service", features = ["test-support"] }
board-central-test-support = { path = "../board-central-test-support", version = "0.1.96" }
codex-router-test-support = { path = "../codex-router-test-support", version = "0.1.96" }
tempfile = "3.27.0"
codex-router-host = { path = "../codex-router-host", version = "0.1.4", features = ["keychain-test-support"] }
collaboration-client = { path = "../collaboration-client", version = "0.1.14" }
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.4", features = ["keychain-test-guard", "test-support"] }
codex-router-auth = { path = "../codex-router-auth", version = "0.1.4", features = ["sync-rusqlite-fixtures", "test-support"] }
codex-router-state = { path = "../codex-router-state", version = "0.1.4", features = ["sync-rusqlite-fixtures"] }
futures-util.workspace = true
rustix.workspace = true
tokio-tungstenite.workspace = true
toml = "1.1.2"
tungstenite = "0.28.0"
tokio = { workspace = true, features = ["test-util"] }
