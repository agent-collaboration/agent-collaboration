[package]
name = "collaboration-central-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["client"]
client = ["dep:collaboration-client", "dep:collaboration-protocol", "dep:reqwest", "dep:reqwest-websocket", "dep:tokio", "dep:futures-util", "dep:sha2", "dep:chrono", "dep:uuid", "dep:ring", "dep:base64", "dep:axum", "dep:board-sync-protocol"]

[dependencies]
collaboration-protocol = { version = "0.1.118", path = "../collaboration-protocol", optional = true }
board-sync-protocol = { version = "0.1.96", path = "../board-sync-protocol", optional = true }
collaboration-client = { version = "0.1.100", path = "../collaboration-client", optional = true }
durable-steps.workspace = true
fleet-sync-protocol.workspace = true
fleet-admission = { version = "0.1.93", path = "../fleet-admission" }
message-board = { version = "0.1.93", path = "../message-board" }
collaboration-central-core = { version = "0.1.93", path = "../collaboration-central-core", features = ["conformance"] }
serde.workspace = true
chrono = { version = "0.4.45", features = ["serde"], optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
reqwest-websocket = { version = "=0.5.1", optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
ring = { version = "=0.17.14", optional = true }
base64 = { version = "0.22.1", optional = true }
axum = { workspace = true, optional = true, features = ["http1", "tokio", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
