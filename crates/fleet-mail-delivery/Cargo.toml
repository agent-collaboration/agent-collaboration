[package]
autotests = false
name = "fleet-mail-delivery"
version = "0.4.0"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
publish.workspace = true
description = "Durable custody rules and delivery hop tasks over borrowed SQLx transactions"

[features]
test-support = []

[dependencies]
durable-steps = { workspace = true }
fleet-protocol = { workspace = true }
runtime-primitives.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sqlx-core = { workspace = true, features = ["migrate"] }
sqlx = { workspace = true, features = ["migrate", "macros"] }
thiserror.workspace = true
sha2 = "0.10.9"

[build-dependencies]
fleet-sync-query-gen = { workspace = true }

[dev-dependencies]
durable-steps = { workspace = true, features = ["turso"] }
sqlx-turso.workspace = true
tokio.workspace = true
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
