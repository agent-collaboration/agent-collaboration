[package]
autotests = false
name = "fleet-websocket-transport"
version = "0.4.0"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
publish.workspace = true
description = "Tokio client and axum server adapters for binary fleet session frames"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
fleet-protocol = { workspace = true }
fleet-session = { workspace = true }
futures-util.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
runtime-primitives = { workspace = true, features = ["tokio"] }
serde.workspace = true
uuid = { version = "1.26.0", default-features = false, features = ["v7", "serde"] }
sqlx = { workspace = true, features = ["migrate", "macros"] }
sqlx-turso.workspace = true
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
