[package]
name = "fleet-copy-workerd-fixture"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

# This real DO adapter fixture has an independent wasm-only feature graph.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false }
sqlx-core = { version = "=0.9.0", default-features = false }
sqlx-durable-object = { git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "eec81ee707873b5a8b266f30e0d193c70338415e", default-features = false }
fleet-protocol = { path = "../../../fleet-protocol", default-features = false }
fleet-project-copy = { path = "../..", default-features = false }
durable-steps = { git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "eec81ee707873b5a8b266f30e0d193c70338415e", default-features = false, features = ["durable-object"] }
runtime-primitives = { git = "https://github.com/agent-collaboration/agent-fleet-sync.git", rev = "eec81ee707873b5a8b266f30e0d193c70338415e", default-features = false, features = ["durable-object"] }
worker = { git = "https://github.com/cloudflare/workers-rs", rev = "b171cb4bdd6fa943bb81f429df0a6b0df37e14b3", default-features = false }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
debug = 0
incremental = false
