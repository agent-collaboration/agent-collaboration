[package]
autotests = false
name = "fleet-project-copy"
version = "0.4.0"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
publish.workspace = true
description = "Runtime-independent replication copy rules over borrowed SQLx scopes"

[dependencies]
durable-steps = { workspace = true }
sqlx-core = { workspace = true, features = ["migrate"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["migrate", "macros"] }
fleet-protocol = { workspace = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
turso_parser.workspace = true
uuid = { version = "1.26.0", default-features = false, features = ["serde"] }

[build-dependencies]
fleet-sync-query-gen = { workspace = true }

[dev-dependencies]
either.workspace = true
futures-util.workspace = true
durable-steps = { workspace = true, features = ["turso"] }
runtime-primitives.workspace = true
tempfile = "3.27.0"
sqlx-turso.workspace = true
tokio.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
