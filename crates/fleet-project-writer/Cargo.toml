[package]
autotests = false
name = "fleet-project-writer"
description = "Captured Turso writers, lease-gated admission and independent copy senders"
version = "0.4.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
durable-steps = { workspace = true, features = ["turso"] }
either.workspace = true
fleet-project-lease = { workspace = true }
fleet-protocol = { workspace = true }
fleet-project-copy = { workspace = true }
futures-core.workspace = true
futures-util.workspace = true
runtime-primitives = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sqlx = { workspace = true, features = ["macros", "migrate"] }
sqlx-core = { workspace = true, features = ["migrate", "offline"] }
sqlx-turso.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
turso.workspace = true
turso_parser.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
sha2 = "0.10.9"
tempfile = "3.27.0"

[build-dependencies]
fleet-sync-query-gen = { workspace = true, default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
