[package]
autotests = false
name = "fleet-native-services"
description = "Native replication copies, lease registry and authenticated sessions"
version = "0.4.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-fault = ["fleet-tokio-objects/test-fault"]
test-support = ["durable-steps/test-support", "fleet-native-writer/test-support", "fleet-native-session/test-support", "fleet-mail-delivery/test-support", "dep:fleet-project-writer", "tokio/io-std"]

[dependencies]
fleet-mail-delivery = { workspace = true }
axum = {version="0.8.9",features=["ws"]}
durable-steps = { workspace = true, features=["turso"] }
fleet-protocol = { workspace = true }
fleet-project-copy = { workspace = true }
fleet-project-lease = { workspace = true }
fleet-project-writer = { workspace = true, optional = true }
fleet-session = { workspace = true }
fleet-native-session.workspace = true
fleet-native-writer.workspace = true
fleet-session-client.workspace = true
fleet-tokio-objects.workspace = true
fleet-websocket-transport = { workspace = true }
runtime-primitives = { workspace = true, features=["tokio"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sqlx = {workspace=true,features=["migrate","macros"]}
sqlx-core = {workspace=true,features=["migrate"]}
sqlx-turso.workspace = true
thiserror.workspace = true
tokio = {workspace=true,features=["fs"]}
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
fleet-sync-query-gen = { workspace = true, features = ["native"] }

[build-dependencies]
fleet-sync-query-gen.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["test-support", "test-fault"]

[[bin]]
name = "fleet-sync-test-consumer"
path = "tests/support/consumer/main.rs"
required-features = ["test-support", "test-fault"]

[[bin]]
name = "delivery_node"
path = "tests/support/consumer/delivery_node_main.rs"
required-features = ["test-support", "test-fault"]
