[package]
name = "fleet-tokio-objects"
autotests = false
version = "0.4.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = []
test-fault = []

[dependencies]
durable-steps = { workspace = true, features = ["turso"] }
fleet-project-writer = { workspace = true }
runtime-primitives = { workspace = true, features = ["tokio"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sqlx-turso = { workspace = true }
sqlx-core = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"
fleet-project-lease.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

