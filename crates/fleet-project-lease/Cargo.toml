[package]
autotests = false
name = "fleet-project-lease"
version = "0.4.0"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
publish.workspace = true
description = "Shared lease values, writer state and runtime-independent registry rules"

[dependencies]
durable-steps = { workspace = true }
fleet-protocol = { workspace = true }
runtime-primitives = { workspace = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
sqlx-core.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros"] }
uuid = { version = "1.26.0", default-features = false, features = ["serde"] }

[build-dependencies]
fleet-sync-query-gen = { workspace = true }

[dev-dependencies]
durable-steps = { workspace = true, features = ["turso"] }
fleet-project-copy = { workspace = true }
sqlx-turso.workspace = true
tokio.workspace = true
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
