[package]
name = "acp-provider-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[example]]
name = "check_recording"
path = "examples/check_recording.rs"
required-features = ["test-support"]

[lints]
workspace = true

[features]
# The owning checks of Router-owned contracts (owned_contract_checks.rs), shared by every part test
# and the live recording checker. Enabled only from dev-dependencies; it adds no dependency, so test
# support (which reaches this crate through the CLI) never forms a cycle with it.
test-support = []

[dependencies]
provider-session-machines.workspace = true
acp-client-runtime = { path = "../acp-client-runtime", version = "0.1.114" }
session-event-model = { path = "../session-event-model", version = "0.1.114" }
serde_json.workspace = true
serde.workspace = true
url = "2.5.8"
tokio.workspace = true
vendor-protocol.workspace = true

[dev-dependencies]
acp-client-runtime = { path = "../acp-client-runtime", version = "0.1.114", features = ["test-support"] }
codex-router-test-support = { path = "../codex-router-test-support", version = "0.1.4", default-features = false }
tempfile = "3.27.0"
tokio-util.workspace = true
