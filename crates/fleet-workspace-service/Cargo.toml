[package]
name = "fleet-workspace-service"
description = "Typed procedures over an owning Fleet workspace database"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fleet-contracts.workspace = true
serde_json.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["derive"] }
workspace-model.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fleet-storage-schema.workspace = true
sqlx = { workspace = true, features = ["macros", "sqlite", "migrate"] }
tempfile = "3.27.0"
tokio.workspace = true
trybuild.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true
