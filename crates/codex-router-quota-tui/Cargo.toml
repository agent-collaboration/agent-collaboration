[package]
name = "codex-router-quota-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
quota-reset-test-harness = ["codex-router-quota-service/quota-reset-test-harness"]
keychain-test-support = ["codex-router-secret-store/keychain-test-guard", "codex-router-secret-store/test-support"]

[dependencies]
chrono.workspace = true
codex-router-core.workspace = true
codex-router-selection = { path = "../codex-router-selection", version = "0.1.4" }
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.4" }
codex-router-state = { path = "../codex-router-state", version = "0.1.4" }
crossterm.workspace = true
iocraft.workspace = true
codex-router-tui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
codex-router-quota-service = { path = "../codex-router-quota-service" }

[dev-dependencies]
futures-util.workspace = true
codex-router-quota-service = { path = "../codex-router-quota-service", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
