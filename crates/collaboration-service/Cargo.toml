[package]
autotests = false
name = "collaboration-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[features]
# Application assembly fixtures for this crate and downstream tests.
test-support = ["router-clock/test-support"]
# Empty: kept only because codex-router-host still enables it; remove with that reference.
runtime-test-support = []

[lints]
workspace = true
[dependencies]
router-clock.workspace = true
collaboration-contracts = { version = "0.1.105", path = "../collaboration-contracts" }
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime" }
runtime-primitives = { workspace = true, features = ["tokio"] }
session-event-model = { path = "../session-event-model", version = "0.1.39" }
interaction-storage = { path = "../interaction-storage", version = "0.1.96" }
base64.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
codex-acp-adapter = { path = "../codex-acp-adapter", version = "0.1.14" }
codex-native-integration.workspace = true
chrono.workspace = true
lifecycle-observation = { path = "../lifecycle-observation", version = "0.1.14" }
futures-util.workspace = true
tokio-tungstenite.workspace = true
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
claude-code-peer-messaging = { path = "../claude-code-peer-messaging", version = "0.1.37" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
agent-automation = { path = "../agent-automation", version = "0.1.16" }
message-board = { path = "../message-board", version = "0.1.20" }
tokio-util.workspace = true
getrandom = "0.3.4"
router-clock = { workspace = true, features = ["test-support"] }
codex-acp-adapter = { path = "../codex-acp-adapter", version = "0.1.14", features = ["test-support"] }
node-test-fixture = { version = "0.1.105", path = "../node-test-fixture" }
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime", features = ["test-support"] }
collaboration-contracts = { version = "0.1.105", path = "../collaboration-contracts", features = ["test-support"] }
collaboration-mcp = { path = "../collaboration-mcp", version = "0.1.30", features = ["test-support"] }
tempfile = "3.27.0"
collaboration-client = { path = "../collaboration-client", version = "0.1.14" }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
