[package]
name = "codex-router-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "automation-debug-host"
path = "src/bin/automation-debug-host.rs"
test = false
bench = false

[features]
runtime-test-support = [
    "collaboration-service/runtime-test-support",
    "collaboration-runtime/runtime-test-support",
    "board-central-test-support/conformance",
]
keychain-test-support = [
    "codex-router-secret-store/keychain-test-guard",
    "codex-router-secret-store/test-support",
]

[lints]
workspace = true

[dependencies]
nix = { workspace = true, features = ["event"] }
sha2.workspace = true
codex-acp-adapter = { path = "../codex-acp-adapter", version = "0.1.14" }
interaction-storage = { path = "../interaction-storage", version = "0.1.96" }
collaboration-runtime = { version = "0.1.105", path = "../collaboration-runtime" }
collaboration-contracts = { version = "0.1.105", path = "../collaboration-contracts" }
fleet-admission = { path = "../fleet-admission", version = "0.1.96" }
fleet-sync-receiver.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
board-fleet-sync = { path = "../board-fleet-sync", version = "0.1.96" }
board-sync-protocol = { path = "../board-sync-protocol", version = "0.1.96" }
durable-steps.workspace = true
fleet-sync-lease.workspace = true
fleet-sync-protocol.workspace = true
fleet-sync-session.workspace = true
fleet-sync-tokio-runner.workspace = true
fleet-sync-writer.workspace = true
runtime-primitives = { workspace = true, features = ["tokio"] }
acp-client-runtime = { path = "../acp-client-runtime", version = "0.1.40" }
acp-provider-adapters = { path = "../acp-provider-adapters", version = "0.1.118" }
session-event-model = { path = "../session-event-model", version = "0.1.40" }
agent-automation = { path = "../agent-automation", version = "0.1.16" }
futures-util.workspace = true
message-board = { path = "../message-board", version = "0.1.20" }
message-board-storage = { path = "../message-board-storage", version = "0.1.20" }
automation-storage = { path = "../automation-storage", version = "0.1.16" }
chrono.workspace = true
lifecycle-observation = { path = "../lifecycle-observation", version = "0.1.14" }
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
claude-code-peer-messaging = { path = "../claude-code-peer-messaging", version = "0.1.37" }
collaboration-service = { path = "../collaboration-service", version = "0.1.14" }
collaboration-mcp = { path = "../collaboration-mcp", version = "0.1.30" }
collaboration-client = { path = "../collaboration-client", version = "0.1.14" }
codex-native-integration.workspace = true
codex-router-core.workspace = true
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.4" }
httparse.workspace = true
opentelemetry.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["event"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
toml = "1.1.2"
tracing-subscriber.workspace = true

[dev-dependencies]
node-test-fixture = { version = "0.1.105", path = "../node-test-fixture" }
collaboration-service = { path = "../collaboration-service", version = "0.1.14", features = ["test-support"] }
codex-router-host = { path = ".", features = ["runtime-test-support"] }
reqwest-websocket = "=0.5.1"
board-legacy-upgrade = { version = "0.1.100", path = "../board-legacy-upgrade" }
collaboration-central-conformance = { version = "0.1.100", path = "../collaboration-central-conformance" }
