fleet-sync-delivery = { workspace = true, features = ["test-support"] }
fleet-sync-writer = { workspace = true, features = ["test-support"] }
board-central-test-support = { version = "0.1.96", path = "../board-central-test-support" }
axum = { workspace = true, features = ["ws"] }
fleet-sync-service.workspace = true
collaboration-mcp = { path = "../collaboration-mcp", version = "0.1.30", features = ["test-support"] }
acp-client-runtime = { path = "../acp-client-runtime", version = "0.1.40", features = ["test-observation"] }
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.4", features = ["keychain-test-guard", "test-support"] }
