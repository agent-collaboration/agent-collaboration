name: Validate changes

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

# DAG: four independent jobs, each on its own Linux runner, each running its
# steps in the background where they don't compete for the same compile. The
# `validated` job is the single gate that depends on all of them.
#
#   checks ─┐
#   lint ───┤
#   build ──┼─► validated
#   test ───┘
#
# Every job installs all rust-toolchain.toml components up front: otherwise
# parallel background cargo steps race rustup's on-demand component download.
#
# rust-cache keys on the toolchain and Cargo.lock with prefix fallback, so a
# workflow edit or a dependency bump reuses the previous build. The optimized
# macOS idle-transport regression runs in the release workflow.
jobs:
  checks:
    name: Format, dependency policy, audit, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      - name: Cache pinned Rust tools
        uses: actions/cache@v4
        with:
          path: tmp/rust-tools
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        run: |
          scripts/tooling/bootstrap-tools.sh ci
          echo "$GITHUB_WORKSPACE/tmp/rust-tools/bin" >> "$GITHUB_PATH"
      - name: Test tool bootstrap
        id: tool_bootstrap
        background: true
        run: python3 -m unittest scripts.tests.test_bootstrap_tools -v
      - name: Check Rust formatting
        id: format
        background: true
        run: cargo fmt --all -- --check
      - name: Test Homebrew release automation
        id: homebrew_release_automation
        background: true
        run: python3 -m unittest scripts.tests.test_update_homebrew_formula scripts.tests.test_publish_homebrew_tap_local -v
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare verification checks
        run: |
          python3 -m venv "$RUNNER_TEMP/router-verification"
          "$RUNNER_TEMP/router-verification/bin/python" -m pip install --disable-pip-version-check pydantic==2.14.1 basedpyright==1.40.2 ruff==0.17.0
      - name: Check verification apparatus
        id: verification_observations
        background: true
        run: |
          verification_python="$RUNNER_TEMP/router-verification/bin/python"
          "$verification_python" -W error::ResourceWarning -m unittest scripts.tests.test_verification_observations scripts.tests.test_verification_lifecycle scripts.tests.test_tailnet_mcp_verification scripts.tests.test_tailnet_mcp_https_transport -v
          "$verification_python" -m ruff check scripts/verification scripts/tests/test_verification_observations.py scripts/tests/test_verification_lifecycle.py scripts/tests/test_tailnet_mcp_verification.py scripts/tests/test_tailnet_mcp_https_transport.py scripts/tests/verification_controller_fixture.py
          "$verification_python" -m ruff format --check scripts/verification scripts/tests/test_verification_observations.py scripts/tests/test_verification_lifecycle.py scripts/tests/test_tailnet_mcp_verification.py scripts/tests/test_tailnet_mcp_https_transport.py scripts/tests/verification_controller_fixture.py
          "$verification_python" -m basedpyright --pythonversion 3.13 --pythonplatform All --pythonpath "$verification_python" scripts/verification scripts/tests/test_verification_observations.py scripts/tests/test_verification_lifecycle.py scripts/tests/test_tailnet_mcp_verification.py scripts/tests/test_tailnet_mcp_https_transport.py scripts/tests/verification_controller_fixture.py
      - name: Enforce dependency policy
        id: dependency_policy
        background: true
        run: cargo deny check
      - name: Audit dependency vulnerabilities
        id: dependency_audit
        run: cargo audit
      - name: Wait for checks
        wait-all:

  lint:
    name: Lint and SQLx metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      - name: Cache pinned Rust tools
        uses: actions/cache@v4
        with:
          path: tmp/rust-tools
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-sqlx-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', 'rust-toolchain.toml') }}
      - name: Enforce Rust file size limit
        run: python3 scripts/tooling/check-rust-file-size.py
      - name: Test Rust file size checker
        run: python3 -m unittest scripts.tests.test_rust_file_size -v
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Runs after clippy so it reuses the checked dependencies instead of
      # racing clippy for the same target directory.
      - name: Check SQLx query metadata against native migrations
        run: |
          scripts/tooling/bootstrap-tools.sh sqlx
          python3 scripts/tooling/prepare-sqlx.py --check
      - name: Lint the Turso driver with every feature
        run: cargo clippy --locked -p sqlx-turso -p sqlx-turso-core -p sqlx-turso-macros --all-targets --all-features -- -D warnings
      - name: Check the reduced Turso driver feature set
        run: cargo check --locked -p sqlx-turso --lib --no-default-features --features runtime-tokio
      - name: Check Turso SQLx metadata against native migrations
        run: |
          python3 -m unittest scripts.tests.test_prepare_sqlx_turso -v
          python3 scripts/tooling/prepare-sqlx-turso.py --check

  build:
    name: Build codex-router variants and quota-reset harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-on-failure: true
      - name: Build codex-router variants and quota-reset harness
        run: |
          cargo build -p codex-router-cli --bin codex-router
          cargo build -p codex-router-cli --all-features --bin codex-router
          install_root="${RUNNER_TEMP}/codex-router-cli-all-features-install"
          cargo install --path crates/codex-router-cli --all-features --root "${install_root}"
          test -x "${install_root}/bin/codex-router"
          test "$(find "${install_root}/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          cargo build -p codex-router-quota-reset-test-harness --bin codex-router-quota-reset-test-harness

  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest
    steps:
      # The steps below build the workspace under several package selections and
      # feature sets, which together outgrow the runner's free disk. Remove
      # preinstalled SDKs this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      # The dependency-structure tests use offline Cargo metadata for all
      # targets, so fetch target-specific packages even on this Linux runner.
      - name: Fetch dependencies for all targets
        run: cargo fetch --locked
      - name: Cache pinned Rust tools
        uses: actions/cache@v4
        with:
          path: tmp/rust-tools
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        run: |
          scripts/tooling/bootstrap-tools.sh ci
          echo "$GITHUB_WORKSPACE/tmp/rust-tools/bin" >> "$GITHUB_PATH"
      # Compile every test binary once, then run the suites in parallel from
      # the built artifacts so they don't contend for cargo's build lock. Each
      # build uses exactly its run step's package selection and features, so
      # the run reuses these artifacts instead of relinking them.
      - name: Build test binaries
        run: |
          cargo nextest run --profile ci --workspace --features codex-router-cli/keychain-test-support --exclude codex-router-quota-reset-test-harness --exclude sqlx-turso --exclude sqlx-turso-core --exclude sqlx-turso-macros --no-run
          cargo nextest run --profile ci --locked -p sqlx-turso -p sqlx-turso-core -p sqlx-turso-macros --all-features --no-run
          cargo nextest run --profile ci --locked -p sqlx-turso-core --no-run
          df -h /
      - name: Test quota-reset terminal integration
        id: quota_reset_terminal_integration
        background: true
        run: cargo nextest run --profile ci -p codex-router-quota-reset-test-harness
      - name: Test Rust workspace
        id: workspace_tests
        background: true
        run: cargo nextest run --profile ci --workspace --features codex-router-cli/keychain-test-support --exclude codex-router-quota-reset-test-harness --exclude sqlx-turso --exclude sqlx-turso-core --exclude sqlx-turso-macros
      - name: Wait for tests
        wait-all:
      - name: Test isolated default Router port cutover
        run: cargo test --locked -p codex-router-cli --features keychain-test-support --test default_router_port_cutover -- --ignored --nocapture
      # The Turso driver runs after the timing-sensitive suites above have finished: its
      # trybuild test compiles a cold dependency graph that would compete with them.
      - name: Test the Turso driver with every feature
        run: cargo nextest run --profile ci --locked -p sqlx-turso -p sqlx-turso-core -p sqlx-turso-macros --all-features
      # The only run with `chrono` off, which covers the driver's `not(feature = "chrono")` paths.
      - name: Test the Turso driver core with default features
        run: cargo nextest run --profile ci --locked -p sqlx-turso-core

  central-core:
    name: Central core boundary and wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: central-core
          cache-on-failure: true
      - name: Enforce the synchronous platform-free core
        run: python3 scripts/tooling/check-central-core-boundary.py
      - name: Check core and protocol on native and wasm
        run: |
          cargo check --locked -p collaboration-central-core -p collaboration-replication-protocol
          cargo check --locked -p collaboration-central-core -p collaboration-replication-protocol --target wasm32-unknown-unknown
          cargo clippy --locked -p collaboration-central-core -p collaboration-replication-protocol --target wasm32-unknown-unknown --lib -- -D warnings

  central-cloudflare:
    name: Central Worker build and local workerd conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: central-cloudflare
          workspaces: |
            . -> target
            crates/collaboration-central-cloudflare -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install pinned local Worker tools
        run: |
          cargo install worker-build --version 0.8.7 --locked --root "$RUNNER_TEMP/central-worker-tools"
          mkdir -p "$RUNNER_TEMP/central-node-tools"
          pnpm --dir "$RUNNER_TEMP/central-node-tools" add --save-exact miniflare@5.20261012.0-beta
          echo "$RUNNER_TEMP/central-worker-tools/bin" >> "$GITHUB_PATH"
      - name: Check the standalone wasm shell and portable test contract
        run: |
          cargo fmt --manifest-path crates/collaboration-central-cloudflare/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/collaboration-central-cloudflare/Cargo.toml --target wasm32-unknown-unknown --all-features -- -D warnings
          cargo check --locked -p collaboration-central-conformance --no-default-features --target wasm32-unknown-unknown
      - name: Prove default Access gating and absence of test controls
        run: |
          worker-build crates/collaboration-central-cloudflare --dev --no-opt -- --locked --no-default-features
          python3 scripts/tooling/check-central-worker-bundle.py production
          cargo run --locked -p collaboration-central-conformance --example workerd_lifecycle -- default node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-default" 8957
      - name: Prove Access, the shared suite and physical process restart locally
        run: |
          worker-build crates/collaboration-central-cloudflare --dev --no-opt -- --locked --features conformance-faults
          python3 scripts/tooling/check-central-worker-bundle.py faults
          cargo run --locked -p collaboration-central-conformance --example workerd_lifecycle -- conformance node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-conformance" 8957
      - name: Prove Fleet feed, notices, outbox loss and rejected-tail restart
        run: |
          for scenario in fleet-feed-restart notice-restart fleet-notices fleet-outbox-restart fleet-outbox-ack tail-restart; do
            cargo run --locked -p collaboration-central-conformance --example workerd_lifecycle -- "$scenario" node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$scenario" 8957
          done
      - name: Build the deployment candidate without test features
        run: |
          worker-build crates/collaboration-central-cloudflare --no-opt -- --locked --no-default-features
          python3 scripts/tooling/check-central-worker-bundle.py production

  validated:
    name: Validate Rust workspace
    if: always()
    needs: [checks, lint, build, test, central-core, central-cloudflare]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        run: |
          for result in "${{ needs.checks.result }}" "${{ needs.lint.result }}" "${{ needs.build.result }}" "${{ needs.test.result }}" "${{ needs.central-core.result }}" "${{ needs.central-cloudflare.result }}"; do
            test "${result}" = "success"
          done
