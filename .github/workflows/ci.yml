name: Validate changes

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

# Four independent Linux jobs feed the existing validation gate. Light static
# checks overlap serial Cargo work; feature-specific E2E binaries keep their
# own target and runner instead of competing with workspace tests.
#
#   static ─┐
#   wasm ───┤
#   test ───┼─► validated
#   e2e ────┘
#
# Every job installs all rust-toolchain.toml components up front: otherwise
# parallel background cargo steps race rustup's on-demand component download.
#
# rust-cache keys on the toolchain and Cargo.lock with prefix fallback, so a
# workflow edit or a dependency bump reuses the previous build. The optimized
# macOS idle-transport regression runs in the release workflow.
jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    # Keep Linux test profiles out of the macOS release cache environment.
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore pinned Rust tools
        id: rust_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', '.github/actions/install-ci-tools/action.yml', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        uses: ./.github/actions/install-ci-tools
        with:
          cache-hit: ${{ steps.rust_tools.outputs.cache-hit }}
      # cargo-modules is not in install-action's managed prebuilt manifests;
      # its cargo-binstall fallback installs this exact version without a cache.
      - name: Install pinned cargo-modules
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-modules@0.28.0
          fallback: cargo-binstall
      - name: Restore pinned SQLx tool
        id: sqlx_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/sqlx
            tmp/rust-tools/bin/cargo-sqlx
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-sqlx-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Check TypeScript verification harness
        run: |
          pnpm --dir verification install --frozen-lockfile
          pnpm --dir verification run check
          pnpm --dir verification run lint
          pnpm --dir verification run format:check
      # Finish both Node suites before Rust background work so TUI's process
      # qualification can keep its existing 10 s test deadline.
      - name: Test TypeScript tooling, fixtures and observations
        id: verification_tests
        run: pnpm --dir verification test
      # Complete verification on its declared Node before switching to TUI's.
      - uses: actions/setup-node@v5
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Check Quota and Sessions verification TypeScript
        id: tui_verification
        run: |
          pnpm --dir scripts/verification/tui install --frozen-lockfile
          pnpm --dir scripts/verification/tui typecheck
          pnpm --dir scripts/verification/tui lint
          pnpm --dir scripts/verification/tui format:check
          pnpm --dir scripts/verification/tui test
      - name: Test workflow timing parser
        run: bash scripts/tests/test_workflow_timing.sh
      - name: Test main cache pruning
        run: bash scripts/tests/test_main_cache_pruning.sh
      - name: Check Rust formatting
        id: format
        background: true
        run: cargo fmt --all -- --check
      - name: Ratchet workspace module cycles
        id: module_cycles
        background: true
        run: cargo nextest run -p workspace-architecture-check --run-ignored only
      - name: Enforce dependency policy
        id: dependency_policy
        background: true
        run: cargo deny check
      - name: Audit dependency vulnerabilities
        id: dependency_audit
        background: true
        run: cargo audit
      - name: Enforce Rust file size limit
        id: rust_file_size
        background: true
        run: node verification/tooling/check-rust-file-size.ts
      # Compiling checks run serially: the measured cold background variant
      # took 20m26s versus 18m27s serial, sharing CPU and Cargo build state.
      - name: Lint Rust workspace
        id: rust_lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check SQLx query metadata against native migrations
        id: sqlite_metadata
        run: |
          scripts/tooling/bootstrap-tools.sh sqlx
          node verification/tooling/prepare-sqlx.ts --check
      - name: Check Turso SQLx metadata against native migrations
        id: turso_metadata
        run: |
          node verification/tooling/prepare-sqlx-turso.ts --check
      - name: Check the shared asynchronous core on native and wasm
        run: |
          cargo check --locked -p collaboration-central-core
          cargo check --locked -p collaboration-central-core --target wasm32-unknown-unknown
          cargo clippy --locked -p collaboration-central-core --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Build codex-router variants and quota-reset harness
        run: |
          cargo build -p codex-router-cli --bin codex-router
          cargo build -p codex-router-cli --all-features --bin codex-router
          install_root="${RUNNER_TEMP}/codex-router-cli-all-features-install"
          # Keep installation-shape assertions on the dev build. The release
          # workflow owns optimized production builds, signing and packaging.
          cargo install --debug --path crates/codex-router-cli --all-features --root "${install_root}"
          test -x "${install_root}/bin/codex-router"
          test "$(find "${install_root}/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          cargo build -p codex-router-quota-reset-test-harness --bin codex-router-quota-reset-test-harness
      - name: Measure pinned tool cache footprint
        run: du -sb tmp/rust-tools
      - name: Wait for checks
        wait-all:
      - name: Save pinned Rust tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ steps.rust_tools.outputs.cache-primary-key }}
      - name: Save pinned SQLx tool
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sqlx_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/sqlx
            tmp/rust-tools/bin/cargo-sqlx
          key: ${{ steps.sqlx_tools.outputs.cache-primary-key }}

  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Keep Linux test profiles out of the macOS release cache environment.
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      # The steps below build the workspace under several package selections and
      # feature sets, which together outgrow the runner's free disk. Remove
      # preinstalled SDKs this job never uses.
      - name: Free runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Install TypeScript fixture dependencies
        run: pnpm --dir verification install --frozen-lockfile
      - uses: actions/setup-node@v5
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Install native adapter test dependencies
        run: |
          pnpm --dir scripts/verification/tui install --frozen-lockfile
          node -e 'const fs=require("node:fs");const crypto=require("node:crypto");const runtime=fs.realpathSync(process.execPath);fs.appendFileSync(process.env.GITHUB_ENV,"QUOTA_STORYBOARD_NODE="+runtime+"\nQUOTA_STORYBOARD_NODE_SHA256="+crypto.createHash("sha256").update(fs.readFileSync(runtime)).digest("hex")+"\n");'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The dependency-structure tests use offline Cargo metadata for all
      # targets, so fetch target-specific packages even on this Linux runner.
      - name: Fetch dependencies for all targets
        run: cargo fetch --locked
      - name: Select quota-reset stage
        id: quota_scope
        if: github.event_name == 'pull_request'
        env:
          QUOTA_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          # Use the tested merge tree so paths match metadata after base-branch moves.
          QUOTA_DIFF_HEAD: ${{ github.sha }}
        run: node verification/tooling/select-quota-stage.ts
      - name: Report skipped quota-reset stage
        if: github.event_name == 'pull_request' && steps.quota_scope.outputs.changed == 'false'
        run: |
          printf 'quota-reset stage skipped: no quota changes\n' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore pinned Rust tools
        id: rust_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', '.github/actions/install-ci-tools/action.yml', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        uses: ./.github/actions/install-ci-tools
        with:
          cache-hit: ${{ steps.rust_tools.outputs.cache-hit }}
      # Compile every test binary once, then run the suites in parallel from
      # the built artifacts so they don't contend for cargo's build lock. Each
      # build uses exactly its run step's package selection and features, so
      # the run reuses these artifacts instead of relinking them.
      # Real Host, importer and forwarding-timer roots run in e2e below.
      # Keep the build/run exclusions and slower-job inventory identical.
      - name: Build test binaries
        run: |
          cargo nextest run --profile ci --status-level all --final-status-level all --workspace --features codex-router-cli/keychain-test-support --exclude codex-router-quota-reset-test-harness -E 'not(binary(=board_records_e2e) | binary(=board_central_e2e) | binary(=local_mail_e2e) | binary(=board_takeover_e2e) | binary(=messaging_rules_e2e) | binary(=installation_directory_e2e) | binary(=mail_reconcile_e2e) | binary(=mail_retirement_e2e) | binary(=upgrade_binary_e2e) | binary(=forwarding_real_timer))' --no-run
          df -h /
      - name: Build quota-reset test binaries
        if: github.event_name != 'pull_request' || steps.quota_scope.outputs.changed == 'true'
        run: cargo nextest run --profile ci --status-level all --final-status-level all -p codex-router-quota-reset-test-harness --no-run
      - name: Test quota-reset terminal integration
        id: quota_reset_terminal_integration
        if: github.event_name != 'pull_request' || steps.quota_scope.outputs.changed == 'true'
        background: true
        run: cargo nextest run --profile ci --status-level all --final-status-level all -p codex-router-quota-reset-test-harness
      - name: Test Rust workspace
        id: workspace_tests
        run: |
          # Exercise private fixture setup under the ordinary Unix mask.
          umask 022
          cargo nextest run --profile ci --status-level all --final-status-level all --workspace --features codex-router-cli/keychain-test-support --exclude codex-router-quota-reset-test-harness -E 'not(binary(=board_records_e2e) | binary(=board_central_e2e) | binary(=local_mail_e2e) | binary(=board_takeover_e2e) | binary(=messaging_rules_e2e) | binary(=installation_directory_e2e) | binary(=mail_reconcile_e2e) | binary(=mail_retirement_e2e) | binary(=upgrade_binary_e2e) | binary(=forwarding_real_timer))'
      - name: Wait for tests
        wait-all:
      - name: Test isolated default Router port cutover
        # Keep the same opt-in case, with a per-test elapsed status as well as
        # its uncaptured CLI proof. The default profile adds no CI deadline.
        run: cargo nextest run --locked --profile default --status-level all --final-status-level all -p codex-router-cli --features keychain-test-support --test default_router_port_cutover --run-ignored only --no-capture
      - name: Save pinned Rust tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ steps.rust_tools.outputs.cache-primary-key }}

  e2e:
    name: Rust local end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      TMPDIR: /tmp
      CODEX_ROUTER_E2E_HOST_BINARY: ${{ github.workspace }}/target/debug/examples/board-debug-runtime
      CODEX_ROUTER_E2E_PARENT: /tmp/router-board-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Install TypeScript fixture dependencies
        run: pnpm --dir verification install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The baseline spent over nine minutes rebuilding these pinned tools.
      # Reuse the same verified cache as static/test before bootstrapping.
      - name: Restore pinned Rust tools
        id: rust_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', '.github/actions/install-ci-tools/action.yml', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        uses: ./.github/actions/install-ci-tools
        with:
          cache-hit: ${{ steps.rust_tools.outputs.cache-hit }}
      - name: Prepare owned runtime roots
        run: mkdir -m 700 "$CODEX_ROUTER_E2E_PARENT"
      - name: Build the real local entry points
        run: |
          cargo build --locked -p agent-collaboration --all-features --bins
          cargo build --locked -p codex-router-host --features runtime-test-support --example board-debug-runtime
          cargo build --locked -p board-legacy-upgrade --bin codex-router-board-upgrade
      - name: Build E2E test binaries
        run: |
          cargo nextest run --locked --profile ci --success-output final -p agent-collaboration --all-features --test board_records_e2e --test board_central_e2e --test local_mail_e2e --test board_takeover_e2e --test messaging_rules_e2e --test installation_directory_e2e --test mail_reconcile_e2e --test mail_retirement_e2e --test-threads 1 --color never --status-level all --final-status-level all --no-run
          cargo nextest run --locked --profile ci -p board-legacy-upgrade --test upgrade_binary_e2e --test-threads 1 --color never --status-level all --final-status-level all --no-run
          cargo nextest run --locked --profile ci -p collaboration-central-tokio --features conformance --test fleet_client_cache --test forwarded_posts --test forwarding_real_timer --test mailbox_rules --test-threads 1 --color never --status-level all --final-status-level all --no-run
      - name: Run the deterministic local process journeys
        run: |
          set -o pipefail
          cargo nextest run --locked --profile ci -p collaboration-central-tokio --features conformance --test fleet_client_cache --test forwarded_posts --test forwarding_real_timer --test mailbox_rules --test-threads 1 --no-fail-fast --color never --status-level all --final-status-level all 2>&1 | tee "$CODEX_ROUTER_E2E_PARENT/nextest.log"
          cargo nextest run --locked --profile ci --success-output final -p agent-collaboration --all-features --test board_records_e2e --test board_central_e2e --test local_mail_e2e --test board_takeover_e2e --test messaging_rules_e2e --test installation_directory_e2e --test mail_reconcile_e2e --test mail_retirement_e2e --test-threads 1 --no-fail-fast --color never --status-level all --final-status-level all 2>&1 | tee -a "$CODEX_ROUTER_E2E_PARENT/nextest.log"
          cargo nextest run --locked --profile ci -p board-legacy-upgrade --test upgrade_binary_e2e --test-threads 1 --no-fail-fast --color never --status-level all --final-status-level all 2>&1 | tee -a "$CODEX_ROUTER_E2E_PARENT/nextest.log"
          if grep -Eq '^[[:space:]]*LEAK[[:space:]]' "$CODEX_ROUTER_E2E_PARENT/nextest.log"; then
            echo "End-to-end child lifecycle leak detected" >&2
            exit 1
          fi
      - name: Save pinned Rust tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ steps.rust_tools.outputs.cache-primary-key }}
      - name: Retain failed process evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-local-e2e-failures
          path: ${{ env.CODEX_ROUTER_E2E_PARENT }}
          if-no-files-found: ignore

  wasm:
    name: Central Worker build and local workerd conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep Linux test profiles out of the macOS release cache environment.
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          workspaces: |
            . -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Install TypeScript bundle guard dependencies
        run: pnpm --dir verification install --frozen-lockfile
      - name: Restore pinned Worker build tool
        id: worker_tools
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/central-worker-tools
          key: ${{ runner.os }}-${{ runner.arch }}-worker-build-0.8.7-${{ env.RUST_TOOLCHAIN }}
      # worker-build publishes no prebuilt release asset at this version.
      - name: Compile pinned Worker build tool
        if: steps.worker_tools.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked --root "$RUNNER_TEMP/central-worker-tools"
      - name: Install pinned local Worker tools
        run: |
          test "$("$RUNNER_TEMP/central-worker-tools/bin/worker-build" --version)" = '0.8.7'
          du -sb "$RUNNER_TEMP/central-worker-tools"
          mkdir -p "$RUNNER_TEMP/central-node-tools"
          pnpm --dir "$RUNNER_TEMP/central-node-tools" add --save-exact --allow-build workerd miniflare@5.20261012.0-beta
          echo "$RUNNER_TEMP/central-worker-tools/bin" >> "$GITHUB_PATH"
      - name: Check the workspace wasm shell and portable test contract
        run: |
          cargo fmt --manifest-path crates/collaboration-central-cloudflare/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/collaboration-central-cloudflare/Cargo.toml --target wasm32-unknown-unknown --all-features -- -D warnings
          cargo check --locked -p collaboration-central-conformance --no-default-features --target wasm32-unknown-unknown
      - name: Build the production profile and reject test controls
        run: |
          worker-build crates/collaboration-central-cloudflare --profile worker-release --no-opt -- --locked --no-default-features
          node verification/tooling/check-central-worker-bundle.ts production
      # Legacy default/conformance and Fleet feed/notice/outbox launchers retire
      # under decisions508/513. Their remaining functional obligations, including
      # normal Worker session/holder equivalence and G18, stay in the removal map.
      - name: Prove current composed controls, transactions and physical restart
        run: |
          worker-build crates/collaboration-central-cloudflare --dev --no-opt -- --locked --features conformance-faults
          node verification/tooling/check-central-worker-bundle.ts faults
          for scenario in runtime-controls composed-copy-suite composed-transactions composed-numeric composed-fleet-conflict; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\tcomposed_scope_workerd/'"$scenario"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example composed_scope_workerd -- "$scenario" node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$scenario" 8957
          done
          for example in step_scope_workerd bootstrap_scope_workerd; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\t'"$example"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example "$example" -- node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$example" 8957
          done
      - name: Prove bounded normal Access and session cases
        run: |
          for scenario in access-sessions access-carryover session-carryover; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\tsession_scope_workerd/'"$scenario"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example session_scope_workerd -- node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$scenario" 8957 "$scenario"
          done
      - name: Prove forwarding and mailbox rules on workerd
        run: |
          for scenario in forward-boundary forward-overlap forward-state forward-terminal forward-real-timer mailbox-identity mailbox-capacity mailbox-cancel mailbox-deadline mailbox-held-retention mailbox-report-terminal; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\tsession_scope_workerd/'"$scenario"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example session_scope_workerd -- node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$scenario" 8957 "$scenario"
          done
      - name: Build the deployment candidate without test features
        run: |
          worker-build crates/collaboration-central-cloudflare --profile worker-release --no-opt -- --locked --no-default-features
          node verification/tooling/check-central-worker-bundle.ts production
      - name: Save pinned Worker build tool
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.worker_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/central-worker-tools
          key: ${{ steps.worker_tools.outputs.cache-primary-key }}

  release-cache:
    name: Warm Apple Silicon release dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    # No Linux test-profile env: match release.yml's hashed Rust environment.
    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.1
      - name: Cache release dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: release-source -> target
          shared-key: release-arm64-background
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Prebuild optimized transport test and schema exporter
        working-directory: release-source
        run: |
          set -euo pipefail
          cargo test --locked --release -p acp-client-runtime --test provider_transport_idle \
            --no-run --message-format=json --timings > "$RUNNER_TEMP/transport-build.jsonl"
          cargo build --locked --release -p collaboration-protocol --example export_protocol_types --timings
      - name: Build release binaries
        working-directory: release-source
        run: cargo build --locked --release -p codex-router-cli -p agent-collaboration -p board-legacy-upgrade --bins --timings
      - name: Measure release cache inputs
        run: du -sk release-source/target "$HOME/.cargo/registry" "$HOME/.cargo/git"
      - name: Retain release cache build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-cache-timing-inventory
          path: |
            ${{ runner.temp }}/transport-build.jsonl
            release-source/target/cargo-timings/

  prune-caches:
    name: Prune superseded main caches
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # needs waits for rust-cache post saves, including successful jobs when
    # another validation job failed. The workflow serializes main producers.
    needs: [static, wasm, test, e2e, release-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Prune superseded main cache keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/tooling/prune-main-caches.sh --apply

  validated:
    name: Validate Rust workspace
    if: always()
    needs: [static, wasm, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Report workflow step and test timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/tooling/report-workflow-timings.sh "$GITHUB_RUN_ID" "$RUNNER_TEMP/workflow-report"
      - name: Retain workflow timing inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-inventory
          path: |
            ${{ runner.temp }}/workflow-report/*.tsv
            ${{ runner.temp }}/workflow-report/jobs.json
            ${{ runner.temp }}/workflow-report/summary.md
      - name: Require every validation job
        run: |
          for result in "${{ needs.static.result }}" "${{ needs.wasm.result }}" "${{ needs.test.result }}" "${{ needs.e2e.result }}"; do
            test "${result}" = "success"
          done
