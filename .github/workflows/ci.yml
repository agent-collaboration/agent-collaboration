name: Validate changes

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

# Static checks, Worker conformance, workspace tests and E2E each report
# their result. Light static checks overlap serial Cargo work; feature-specific
# E2E binaries keep their own runner instead of competing with workspace tests.
#
# Every job installs all rust-toolchain.toml components up front: otherwise
# parallel background cargo steps race rustup's on-demand component download.
#
# rust-cache keys on the toolchain and Cargo.lock with prefix fallback, so a
# workflow edit or a dependency bump reuses the previous build. The optimized
# macOS idle-transport regression runs in the release workflow.
jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      # Workspace Clippy and native/wasm builds share target/ and outgrow
      # runner disk. Remove preinstalled SDKs unused here.
      - name: Free runner disk space
        background: true
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore pinned Rust tools
        id: rust_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', '.github/actions/install-ci-tools/action.yml', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        uses: ./.github/actions/install-ci-tools
        with:
          cache-hit: ${{ steps.rust_tools.outputs.cache-hit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Check TypeScript verification harness
        run: |
          pnpm --dir verification install --frozen-lockfile
          pnpm --dir verification run check
          pnpm --dir verification run lint
          pnpm --dir verification run format:check
      # Finish both Node suites before Rust background work so TUI's process
      # qualification can keep its existing 10 s test deadline.
      - name: Test TypeScript tooling, fixtures and observations
        id: verification_tests
        run: |
          # Stopped-root fixtures retain the declared macOS-shaped staging path.
          # Ubuntu lacks its parent; children still enforce private ownership.
          sudo install -d -m 1777 /private/tmp
          pnpm --dir verification test
      - name: Check embedded Claude ACP metadata package
        run: |
          pnpm --dir providers/claude-acp install --frozen-lockfile
          pnpm --dir providers/claude-acp check
          pnpm --dir providers/claude-acp lint
          pnpm --dir providers/claude-acp format:check
          pnpm --dir providers/claude-acp test
          pnpm --dir providers/claude-acp build:check
      # Complete verification on its declared Node before switching to TUI's.
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Check Quota and Sessions verification TypeScript
        id: tui_verification
        run: |
          pnpm --dir scripts/verification/tui install --frozen-lockfile
          pnpm --dir scripts/verification/tui typecheck
          pnpm --dir scripts/verification/tui lint
          pnpm --dir scripts/verification/tui format:check
          pnpm --dir scripts/verification/tui test
      - name: Test main cache pruning
        run: bash scripts/tests/test_main_cache_pruning.sh
      - name: Test cargo debug signing runner
        run: bash scripts/tests/test_cargo_debug_signing_runner.sh
      - name: Wait for runner disk cleanup
        wait-all:
      - name: Check Rust formatting
        id: format
        background: true
        run: cargo fmt --all -- --check
      - name: Early warning for shipping test-support closure (Linux host, Apple Silicon target)
        id: shipping_support_early_warning
        background: true
        run: |
          set -euo pipefail
          production_graph="$(cargo tree --locked --color never --target aarch64-apple-darwin -p codex-router-cli -p agent-collaboration -e normal,build,features)"
          if grep -Eq -- '-test-support v[0-9]|feature "test-support"' <<< "$production_graph"; then
            echo 'production dependency graph includes a test-support crate or feature' >&2
            exit 1
          fi
      - name: Enforce dependency policy
        id: dependency_policy
        background: true
        run: cargo deny check
      - name: Audit dependency vulnerabilities
        id: dependency_audit
        background: true
        run: cargo audit
      - name: Enforce Rust file size limit
        id: rust_file_size
        background: true
        run: node verification/tooling/check-rust-file-size.ts
      # Keep compiling checks serial within this runner. Metadata, module
      # analysis and binary variants have separate runners below.
      - name: Lint Rust workspace
        id: rust_lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Challenge TUI terminal input ownership
        run: node verification/tooling/check-tui-input-ownership.ts
      - name: Check the shared asynchronous core on native and wasm
        run: |
          cargo check --locked -p collaboration-central-core
          cargo check --locked -p collaboration-central-core --target wasm32-unknown-unknown
          cargo clippy --locked -p collaboration-central-core --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Measure pinned tool cache footprint
        run: du -sb tmp/rust-tools
      - name: Wait for checks
        wait-all:
      - name: Save pinned Rust tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ steps.rust_tools.outputs.cache-primary-key }}

  # Run 42796598374 spent 40m14s in static validation: SQLite/Turso
  # metadata took 14m19s and binary variants another 13m43s in sequence.
  # Separate runners preserve every command without Cargo lock/CPU contention.
  architecture:
    name: Workspace module cycles
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        background: true
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      # Static checks remain the only writer for this dependency cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static
          save-if: false
      - name: Restore pinned Rust tools
        id: rust_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', '.github/actions/install-ci-tools/action.yml', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        uses: ./.github/actions/install-ci-tools
        with:
          cache-hit: ${{ steps.rust_tools.outputs.cache-hit }}
      - name: Install pinned cargo-modules
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-modules@0.28.0
          fallback: cargo-binstall
      - name: Wait for runner disk cleanup
        wait-all:
      - name: Ratchet workspace module cycles
        id: module_cycles
        run: cargo nextest run -p workspace-architecture-check --run-ignored only

  metadata:
    name: SQLx metadata validation
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        background: true
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      # Static checks remain the only writer for this dependency cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static
          save-if: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Restore pinned SQLx tool
        id: sqlx_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/sqlx
            tmp/rust-tools/bin/cargo-sqlx
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-sqlx-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', 'rust-toolchain.toml') }}
      - name: Wait for runner disk cleanup
        wait-all:
      - name: Check SQLx query metadata against native migrations
        id: sqlite_metadata
        run: |
          scripts/tooling/bootstrap-tools.sh sqlx
          node verification/tooling/prepare-sqlx.ts --check
      - name: Check Turso SQLx metadata against native migrations
        id: turso_metadata
        run: |
          node verification/tooling/prepare-sqlx-turso.ts --check
      - name: Save pinned SQLx tool
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sqlx_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/sqlx
            tmp/rust-tools/bin/cargo-sqlx
          key: ${{ steps.sqlx_tools.outputs.cache-primary-key }}

  variants:
    name: Rust binary variants and install shape
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        background: true
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      # Static checks remain the only writer for this dependency cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static
          save-if: false
      - name: Wait for runner disk cleanup
        wait-all:
      - name: Build codex-router variants and quota-reset harness
        run: |
          cargo build -p codex-router-cli --bin codex-router
          cargo build -p codex-router-cli --all-features --bin codex-router
          install_root="${RUNNER_TEMP}/codex-router-cli-all-features-install"
          # Keep installation-shape assertions on the dev build. The release
          # workflow owns optimized production builds, signing and packaging.
          cargo install --debug --target-dir target --path crates/codex-router-cli --all-features --root "${install_root}"
          test -x "${install_root}/bin/codex-router"
          test "$(find "${install_root}/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          cargo build -p codex-router-quota-reset-test-harness --bin codex-router-quota-reset-test-harness
          df -h /

  # The workspace tests are CPU-bound on one 4-vCPU runner. Four count
  # partitions reduce the measured 16m build plus 20m first-half critical path.
  # Shard 1 builds every test binary once, uploads a nextest archive, then runs
  # its partition. Other shards set up in parallel and reuse that archive.
  test:
    name: Test Rust workspace (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # Re-run attempts upload their own archive instead of reusing a stale one.
      TEST_ARCHIVE_NAME: workspace-test-archive-${{ github.run_attempt }}
      # Tests whose real Host, importer and forwarding-timer roots run in e2e.
      WORKSPACE_TEST_FILTER: 'not((package(=agent-collaboration) & binary(=e2e)) | (package(=collaboration-central-tokio) & binary(=e2e) & test(/^forwarding_real_timer::/)))'
    steps:
      # The steps below build the workspace under several package selections and
      # feature sets, which together outgrow the runner's free disk. Remove
      # preinstalled SDKs this job never uses.
      - name: Free runner disk space
        background: true
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Install TypeScript fixture dependencies
        run: |
          pnpm --dir verification install --frozen-lockfile
          pnpm --dir providers/claude-acp install --frozen-lockfile
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Install native adapter test dependencies
        run: |
          pnpm --dir scripts/verification/tui install --frozen-lockfile
          node -e 'const fs=require("node:fs");const crypto=require("node:crypto");const runtime=fs.realpathSync(process.execPath);fs.appendFileSync(process.env.GITHUB_ENV,"QUOTA_STORYBOARD_NODE="+runtime+"\nQUOTA_STORYBOARD_NODE_SHA256="+crypto.createHash("sha256").update(fs.readFileSync(runtime)).digest("hex")+"\n");'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      # Shard 1 builds the workspace tests and shard 2 the quota-reset harness;
      # only shard 1 saves the shared dependency cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The dependency-structure tests use offline Cargo metadata for all
      # targets, so fetch target-specific packages even on this Linux runner.
      - name: Fetch dependencies for all targets
        run: cargo fetch --locked
      - name: Select quota-reset stage
        id: quota_scope
        if: matrix.shard == 2 && github.event_name == 'pull_request'
        env:
          QUOTA_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          # Use the tested merge tree so paths match metadata after base-branch moves.
          QUOTA_DIFF_HEAD: ${{ github.sha }}
        run: node verification/tooling/select-quota-stage.ts
      - name: Report skipped quota-reset stage
        if: matrix.shard == 2 && github.event_name == 'pull_request' && steps.quota_scope.outputs.changed == 'false'
        run: |
          printf 'quota-reset stage skipped: no quota changes\n' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore pinned Rust tools
        id: rust_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', '.github/actions/install-ci-tools/action.yml', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        uses: ./.github/actions/install-ci-tools
        with:
          cache-hit: ${{ steps.rust_tools.outputs.cache-hit }}
      - name: Wait for runner disk cleanup
        wait-all:
      # Compile every test binary once and pack it as a nextest archive, so both
      # shards run the same binaries without contending for Cargo's build lock.
      # Keep each build selection and feature set identical to its run.
      - name: Build test binaries
        if: matrix.shard == 1
        run: |
          cargo nextest archive --locked --workspace --features codex-router-cli/keychain-test-support --exclude codex-router-quota-reset-test-harness --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst"
          ls -l "$RUNNER_TEMP/workspace-tests.tar.zst"
          df -h /
      - name: Share test binaries with other shards
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_ARCHIVE_NAME }}
          path: ${{ runner.temp }}/workspace-tests.tar.zst
          retention-days: 1
          # The archive is already zstd-compressed.
          compression-level: 0
      - name: Test Rust workspace, first partition
        id: workspace_tests
        if: matrix.shard == 1
        run: |
          # Exercise private fixture setup under the ordinary Unix mask.
          umask 022
          cargo nextest run --profile ci --status-level all --final-status-level all --workspace --features codex-router-cli/keychain-test-support --exclude codex-router-quota-reset-test-harness -E "$WORKSPACE_TEST_FILTER" --partition count:1/4
      # Only shard 2 builds and runs the quota-reset harness and the default-port
      # cutover while shard 1 is still building. Each keeps its own package and
      # feature selection, and both finish before the archive lands in target/.
      - name: Build quota-reset test binaries
        if: matrix.shard == 2 && (github.event_name != 'pull_request' || steps.quota_scope.outputs.changed == 'true')
        run: cargo nextest run --profile ci --status-level all --final-status-level all -p codex-router-quota-reset-test-harness --no-run
      - name: Test quota-reset terminal integration
        id: quota_reset_terminal_integration
        if: matrix.shard == 2 && (github.event_name != 'pull_request' || steps.quota_scope.outputs.changed == 'true')
        run: cargo nextest run --profile ci --status-level all --final-status-level all -p codex-router-quota-reset-test-harness
      - name: Test isolated default Router port cutover
        if: matrix.shard == 2
        # Keep the same opt-in case, with a per-test elapsed status as well as
        # its uncaptured CLI proof. The default profile adds no CI deadline.
        run: cargo nextest run --locked --profile default --status-level all --final-status-level all -p codex-router-cli --features keychain-test-support --test e2e --run-ignored only --no-capture
      # Other shards wait for an archive in this run, or shard 1 no longer
      # building one in this attempt. Any attempt's archive was built from
      # this run's commit, so a rerun of any shard alone reuses the newest one.
      # The sleep only spaces the API polls.
      - name: Wait for shard 1's test binaries
        id: test_archive
        if: matrix.shard != 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            archive="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select((.name | startswith("workspace-test-archive-")) and (.expired | not))] | max_by(.name | ltrimstr("workspace-test-archive-") | tonumber) | .name // empty')"
            if [ -n "$archive" ]; then
              echo "name=$archive" >> "$GITHUB_OUTPUT"
              break
            fi
            builder_status="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$GITHUB_RUN_ATTEMPT" --json jobs --jq '.jobs[] | select(.name == "Test Rust workspace (1/4)") | .status')"
            if [ "$builder_status" != queued ] && [ "$builder_status" != in_progress ] && [ "$builder_status" != waiting ] && [ "$builder_status" != pending ] && [ "$builder_status" != requested ]; then
              echo "No test archive in this run, and shard 1 is not building one in this attempt (status: ${builder_status:-not part of this attempt}). Re-run all jobs." >&2
              exit 1
            fi
            sleep 20
          done
      - name: Download shard 1's test binaries
        if: matrix.shard != 1
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ steps.test_archive.outputs.name }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARCHIVE_NAME" --dir "$RUNNER_TEMP"
      # Tests start compiled binaries through compile-time CARGO_BIN_EXE paths
      # under target/. The checkout path is the same on both runners, so unpack
      # the archive (whose entries start with target/) in place and run from its
      # metadata instead of letting nextest relocate it to a temporary folder.
      - name: Unpack shard 1's test binaries into target/
        if: matrix.shard != 1
        run: tar --zstd -xf "$RUNNER_TEMP/workspace-tests.tar.zst" -C "$GITHUB_WORKSPACE"
      - name: Test Rust workspace, remaining partitions
        if: matrix.shard != 1
        run: |
          # Exercise private fixture setup under the ordinary Unix mask.
          umask 022
          cargo nextest run --profile ci --status-level all --final-status-level all --binaries-metadata target/nextest/binaries-metadata.json --cargo-metadata target/nextest/cargo-metadata.json -E "$WORKSPACE_TEST_FILTER" --partition count:${{ matrix.shard }}/4
      - name: Save pinned Rust tools
        if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ steps.rust_tools.outputs.cache-primary-key }}

  e2e:
    name: Rust local end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      TMPDIR: /tmp
      CODEX_ROUTER_E2E_HOST_BINARY: ${{ github.workspace }}/target/debug/board-debug-runtime
      CODEX_ROUTER_E2E_PARENT: /tmp/router-board-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Install TypeScript fixture dependencies
        run: pnpm --dir verification install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The baseline spent over nine minutes rebuilding these pinned tools.
      # Reuse the same verified cache as static/test before bootstrapping.
      - name: Restore pinned Rust tools
        id: rust_tools
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', '.github/actions/install-ci-tools/action.yml', 'rust-toolchain.toml') }}
      - name: Verify and install pinned Rust tools
        uses: ./.github/actions/install-ci-tools
        with:
          cache-hit: ${{ steps.rust_tools.outputs.cache-hit }}
      - name: Prepare owned runtime roots
        run: mkdir -m 700 "$CODEX_ROUTER_E2E_PARENT"
      - name: Build the real local entry points
        run: |
          cargo build --locked -p agent-collaboration --all-features --bins
          cargo build --locked -p codex-router-debug-hosts --features runtime-test-support --bin board-debug-runtime
      - name: Build E2E test binaries
        run: |
          cargo nextest run --locked --profile ci --success-output final -p agent-collaboration --all-features --test e2e --test-threads 1 --color never --status-level all --final-status-level all --no-run
          cargo nextest run --locked --profile ci -p collaboration-central-tokio --features conformance --test e2e --test-threads 1 --color never --status-level all --final-status-level all --no-run
      - name: Run the deterministic local process journeys
        run: |
          set -o pipefail
          cargo nextest run --locked --profile ci -p collaboration-central-tokio --features conformance --test e2e --test-threads 1 --no-fail-fast --color never --status-level all --final-status-level all 2>&1 | tee "$CODEX_ROUTER_E2E_PARENT/nextest.log"
          cargo nextest run --locked --profile ci --success-output final -p agent-collaboration --all-features --test e2e --test-threads 1 --no-fail-fast --color never --status-level all --final-status-level all 2>&1 | tee -a "$CODEX_ROUTER_E2E_PARENT/nextest.log"
          if grep -Eq '^[[:space:]]*LEAK[[:space:]]' "$CODEX_ROUTER_E2E_PARENT/nextest.log"; then
            echo "End-to-end child lifecycle leak detected" >&2
            exit 1
          fi
      - name: Save pinned Rust tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/rust-tools/bin/cargo-nextest
            tmp/rust-tools/bin/cargo-deny
            tmp/rust-tools/bin/cargo-audit
          key: ${{ steps.rust_tools.outputs.cache-primary-key }}
      - name: Retain failed process evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-local-e2e-failures
          path: ${{ env.CODEX_ROUTER_E2E_PARENT }}
          if-no-files-found: ignore

  wasm:
    name: Central Worker build and local workerd conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          workspaces: |
            . -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: verification/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: verification/package.json
      - name: Install TypeScript bundle guard dependencies
        run: pnpm --dir verification install --frozen-lockfile
      - name: Restore pinned Worker build tool
        id: worker_tools
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/central-worker-tools
          key: ${{ runner.os }}-${{ runner.arch }}-worker-build-0.8.7-${{ env.RUST_TOOLCHAIN }}
      # worker-build publishes no prebuilt release asset at this version.
      - name: Compile pinned Worker build tool
        if: steps.worker_tools.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked --root "$RUNNER_TEMP/central-worker-tools"
      - name: Install pinned local Worker tools
        run: |
          test "$("$RUNNER_TEMP/central-worker-tools/bin/worker-build" --version)" = '0.8.7'
          du -sb "$RUNNER_TEMP/central-worker-tools"
          mkdir -p "$RUNNER_TEMP/central-node-tools"
          pnpm --dir "$RUNNER_TEMP/central-node-tools" add --save-exact --allow-build workerd miniflare@5.20261012.0-beta
          echo "$RUNNER_TEMP/central-worker-tools/bin" >> "$GITHUB_PATH"
      - name: Check the workspace wasm shell and portable test contract
        run: |
          cargo fmt --manifest-path crates/collaboration-central-cloudflare/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/collaboration-central-cloudflare/Cargo.toml --target wasm32-unknown-unknown --all-features -- -D warnings
          cargo check --locked -p collaboration-central-conformance --no-default-features --target wasm32-unknown-unknown
      - name: Build the production profile and reject test controls
        run: |
          worker-build crates/collaboration-central-cloudflare --profile worker-release --no-opt -- --locked --no-default-features
          node verification/tooling/check-central-worker-bundle.ts production
      # Legacy default/conformance and Fleet feed/notice/outbox launchers retire
      # under decisions508/513. Their remaining functional obligations, including
      # normal Worker session/holder equivalence and G18, stay in the removal map.
      - name: Prove current composed controls, transactions and physical restart
        run: |
          worker-build crates/collaboration-central-cloudflare --dev --no-opt -- --locked --features conformance-faults
          node verification/tooling/check-central-worker-bundle.ts faults
          for scenario in runtime-controls composed-copy-suite composed-transactions composed-numeric composed-fleet-conflict; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\tcomposed_scope_workerd/'"$scenario"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example composed_scope_workerd -- "$scenario" node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$scenario" 8957
          done
          for example in step_scope_workerd bootstrap_scope_workerd; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\t'"$example"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example "$example" -- node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$example" 8957
          done
      - name: Prove bounded normal Access and session cases
        run: |
          for scenario in access-sessions access-carryover session-carryover; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\tsession_scope_workerd/'"$scenario"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example session_scope_workerd -- node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$scenario" 8957 "$scenario"
          done
      - name: Prove forwarding and mailbox rules on workerd
        run: |
          for scenario in forward-boundary forward-overlap forward-state forward-terminal forward-real-timer mailbox-identity mailbox-capacity mailbox-cancel fleet-mail-expiry mailbox-held-retention mailbox-report-terminal; do
            TIMEFORMAT=$'WORKERD_TEST\t%3R\tsession_scope_workerd/'"$scenario"
            time cargo run --locked -p collaboration-central-tokio --features conformance --example session_scope_workerd -- node "$RUNNER_TEMP/central-node-tools/node_modules/miniflare/dist/src/index.js" "$RUNNER_TEMP/central-workerd-$scenario" 8957 "$scenario"
          done
      - name: Build the deployment candidate without test features
        run: |
          worker-build crates/collaboration-central-cloudflare --profile worker-release --no-opt -- --locked --no-default-features
          node verification/tooling/check-central-worker-bundle.ts production
      # Verification O1 on the Cloudflare host: the storage cases run inside real
      # SQLite-backed Durable Objects under the pinned Miniflare and workerd.
      - name: Run the storage boundary cases in workerd
        run: |
          worker-build crates/collaboration-central-cloudflare --dev --no-opt --out-dir build-test-support -- --locked --features test-support
          pnpm --dir verification run test:workerd
      - name: Save pinned Worker build tool
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.worker_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/central-worker-tools
          key: ${{ steps.worker_tools.outputs.cache-primary-key }}

  prune-caches:
    name: Prune superseded main caches
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # needs waits for rust-cache post saves, including successful jobs when
    # another validation job failed. The workflow serializes main producers.
    needs: [static, architecture, metadata, variants, wasm, test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Prune superseded main cache keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/tooling/prune-main-caches.sh --apply
