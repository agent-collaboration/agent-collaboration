name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish
        required: false
        type: string
      dry_run:
        description: Build, sign and verify this ref without publishing or updating the tap
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Keychain approvals belong to a code identity; a fixed identifier and team keep
  # one identity across releases. Debug builds use "<identifier>.debug".
  DEVELOPER_ID_TEAM: 974QD84WVC
  CODE_IDENTIFIER_PREFIX: dev.shravansunder

jobs:
  release:
    name: Apple Silicon release
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      asset_sha256: ${{ steps.artifact.outputs.sha256 }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout tagged release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Install Node for release formula checks
        uses: actions/setup-node@v4
        with:
          node-version-file: release-source/verification/package.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.1

      - name: Validate release metadata and architecture
        id: metadata
        working-directory: release-source
        run: |
          set -euo pipefail

          if [[ "${RELEASE_DRY_RUN}" != "true" && ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use v<major>.<minor>.<patch> syntax" >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          runner_architecture="$(uname -m)"
          if [[ "${runner_architecture}" != "arm64" ]]; then
            echo "release requires an arm64 runner; received ${runner_architecture}" >&2
            exit 1
          fi

          source_commit="$(git rev-parse HEAD)"
          if [[ "${RELEASE_DRY_RUN}" != "true" ]]; then
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${source_commit}" != "${tag_commit}" ]]; then
              echo "checked-out source does not match the release tag" >&2
              exit 1
            fi
            if [[ "$(git tag --points-at HEAD --list "${RELEASE_TAG}")" != "${RELEASE_TAG}" ]]; then
              echo "release tag is not exact for the checked-out source" >&2
              exit 1
            fi
          fi

          cargo_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "codex-router-cli") | .version'
          )"
          if [[ "${RELEASE_DRY_RUN}" == "true" ]]; then
            release_version="${cargo_version}"
          fi
          if [[ "${cargo_version}" != "${release_version}" ]]; then
            echo "release tag version does not match codex-router-cli" >&2
            exit 1
          fi

          {
            echo "version=${release_version}"
            echo "source_commit=${source_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Report cache save policy
        env:
          CACHE_SAVE_ALLOWED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          printf 'Cache save allowed: %s\n' "$CACHE_SAVE_ALLOWED"
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ]]; then
            test "$CACHE_SAVE_ALLOWED" = false
          fi

      - name: Cache release dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: release-source -> target
          shared-key: release-arm64-background
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Prepare small consumers serially: concurrent Cargo compiles would wait
      # on the shared target lock rather than run independently.
      - name: Prebuild optimized transport test and schema exporter
        id: prebuild
        working-directory: release-source
        run: |
          set -euo pipefail
          cargo test --locked --release -p acp-client-runtime --test provider_transport_idle \
            --no-run --message-format=json --timings > "$RUNNER_TEMP/transport-build.jsonl"
          transport_binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "provider_transport_idle" and .executable != null) | .executable' "$RUNNER_TEMP/transport-build.jsonl")"
          test -x "$transport_binary"
          echo "transport_binary=$transport_binary" >> "$GITHUB_OUTPUT"
          cargo build --locked --release -p collaboration-protocol --example export_protocol_types --timings

      - name: Build release binaries
        id: release_binaries
        background: true
        working-directory: release-source
        run: cargo build --locked --release -p codex-router-cli -p agent-collaboration -p board-legacy-upgrade --bins --timings

      # Optimized macOS code generation reproduces the FuturesUnordered
      # waker-identity regression; a development-profile test cannot replace it.
      - name: Test optimized provider transport
        id: optimized_transport
        background: true
        env:
          TRANSPORT_BINARY: ${{ steps.prebuild.outputs.transport_binary }}
        run: |
          set -euo pipefail
          transport_tests="$("$TRANSPORT_BINARY" --list | sed -n 's/: test$//p')"
          test -n "$transport_tests"
          failed_tests=0
          while IFS= read -r test_name; do
            started_seconds="$(date +%s)"
            if "$TRANSPORT_BINARY" --exact "$test_name" --nocapture; then
              test_status=0
            else
              test_status=$?
              failed_tests=$((failed_tests + 1))
            fi
            printf 'TRANSPORT_TEST\t%s\t%s\t%s\n' "$(( $(date +%s) - started_seconds ))" "$test_status" "$test_name"
          done <<< "$transport_tests"
          test "$failed_tests" -eq 0

      - name: Export release protocol schemas
        id: protocol_schemas
        background: true
        working-directory: release-source
        run: |
          set -euo pipefail
          mkdir -p target/protocol-schemas/communication-control target/protocol-schemas/acp-protocol
          target/release/examples/export_protocol_types > target/protocol-schemas/communication-control/protocol-types.json
          cp protocol-schemas/acp-protocol/stable-schema.json protocol-schemas/acp-protocol/upstream-license.txt target/protocol-schemas/acp-protocol/
          cp protocol-schemas/schema-packaging.md target/protocol-schemas/

      - name: Reject test-only production features
        id: production_features
        background: true
        working-directory: release-source
        run: |
          set -euo pipefail
          dependency_features="$(cargo tree --locked -p codex-router-cli -p agent-collaboration -p board-legacy-upgrade -e normal,build,features -i codex-router-secret-store)"
          if grep -q 'keychain-test-guard' <<< "$dependency_features"; then
            echo 'release dependency graph includes keychain-test-guard' >&2
            exit 1
          fi

      - name: Wait for release build and checks
        wait-all:

      - name: Retain release build and test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-timing-inventory
          path: |
            ${{ runner.temp }}/transport-build.jsonl
            release-source/target/cargo-timings/

      - name: Require the Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_BASE64}" || -z "${APPLE_CERTIFICATE_PASSWORD}" ]]; then
            echo "APPLE_CERTIFICATE_BASE64 and APPLE_CERTIFICATE_PASSWORD are required to sign the release" >&2
            exit 1
          fi

      - name: Import the Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign release binaries with the Developer ID identity
        working-directory: release-source
        run: |
          set -euo pipefail
          signing_identity="$(
            security find-identity -v -p codesigning |
              awk -v team="(${DEVELOPER_ID_TEAM})\"" 'index($0, "Developer ID Application") && index($0, team) { print $2; exit }'
          )"
          if [[ -z "${signing_identity}" ]]; then
            echo "no Developer ID Application identity for team ${DEVELOPER_ID_TEAM}" >&2
            exit 1
          fi
          for executable in codex-router agent-collaboration agent-sessions codex-router-board-upgrade; do
            codesign --force --sign "${signing_identity}" \
              --identifier "${CODE_IDENTIFIER_PREFIX}.${executable}" \
              --options runtime --timestamp \
              "target/release/${executable}"
          done

      - name: Verify and package release binary
        id: artifact
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        working-directory: release-source
        run: |
          set -euo pipefail

          verify_release_signature() {
            local binary="$1"
            local signature
            codesign --verify --strict --verbose=2 "${binary}"
            signature="$(codesign -dv --verbose=2 "${binary}" 2>&1)"
            if ! grep -qx "Identifier=${CODE_IDENTIFIER_PREFIX}.$(basename "${binary}")" <<<"${signature}" ||
              ! grep -qx "TeamIdentifier=${DEVELOPER_ID_TEAM}" <<<"${signature}" ||
              ! grep -q "flags=.*runtime" <<<"${signature}"; then
              echo "${binary} is not signed as ${CODE_IDENTIFIER_PREFIX}.$(basename "${binary}") by team ${DEVELOPER_ID_TEAM} with the hardened runtime" >&2
              exit 1
            fi
          }

          release_binary="target/release/codex-router"
          file_description="$(file "${release_binary}")"
          if [[ "${file_description}" != *"Mach-O 64-bit executable arm64"* ]]; then
            echo "release binary is not Mach-O arm64" >&2
            exit 1
          fi
          verify_release_signature "${release_binary}"
          if [[ "$("${release_binary}" --version)" != "codex-router ${RELEASE_VERSION}" ]]; then
            echo "release binary version does not match the release tag" >&2
            exit 1
          fi

          collaboration_binary="target/release/agent-collaboration"
          if [[ "$(file "${collaboration_binary}")" != *"Mach-O 64-bit executable arm64"* ]]; then
            echo "agent-collaboration binary is not Mach-O arm64" >&2
            exit 1
          fi
          verify_release_signature "${collaboration_binary}"
          if [[ "$("${collaboration_binary}" --version)" != "agent-collaboration ${RELEASE_VERSION}" ]]; then
            echo "agent-collaboration version does not match release tag" >&2
            exit 1
          fi

          session_binary="target/release/agent-sessions"
          if [[ "$(file "${session_binary}")" != *"Mach-O 64-bit executable arm64"* ]]; then
            echo "agent-sessions binary is not Mach-O arm64" >&2
            exit 1
          fi
          verify_release_signature "${session_binary}"
          if [[ "$("${session_binary}" --version)" != "agent-sessions ${RELEASE_VERSION}" ]]; then
            echo "agent-sessions version does not match release tag" >&2
            exit 1
          fi

          upgrade_binary="target/release/codex-router-board-upgrade"
          if [[ "$(file "${upgrade_binary}")" != *"Mach-O 64-bit executable arm64"* ]]; then
            echo "codex-router-board-upgrade binary is not Mach-O arm64" >&2
            exit 1
          fi
          verify_release_signature "${upgrade_binary}"
          if [[ "$("${upgrade_binary}" --version)" != "codex-router-board-upgrade ${RELEASE_VERSION}" ]]; then
            echo "codex-router-board-upgrade version does not match release tag" >&2
            exit 1
          fi

          asset_name="codex-router-v${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz"
          release_directory="${RUNNER_TEMP}/codex-router-release"
          payload_directory="${release_directory}/payload"
          mkdir -p "${payload_directory}"
          install -m 0755 "${release_binary}" "${payload_directory}/codex-router"
          install -m 0755 "${collaboration_binary}" "${payload_directory}/agent-collaboration"
          install -m 0755 "${session_binary}" "${payload_directory}/agent-sessions"
          install -m 0755 "${upgrade_binary}" "${payload_directory}/codex-router-board-upgrade"
          cp -R target/protocol-schemas "${payload_directory}/protocol-schemas"
          install -m 0644 docs/agent-guidance/agent-collaboration.md "${payload_directory}/agent-collaboration-guide.md"
          COPYFILE_DISABLE=1 tar \
            -C "${payload_directory}" \
            -czf "${release_directory}/${asset_name}" \
            codex-router agent-collaboration agent-sessions codex-router-board-upgrade \
            protocol-schemas agent-collaboration-guide.md
          asset_sha256="$(shasum -a 256 "${release_directory}/${asset_name}" | cut -d ' ' -f 1)"

          {
            echo "name=${asset_name}"
            echo "path=${release_directory}/${asset_name}"
            echo "sha256=${asset_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release formula generation
        env:
          ASSET_SHA256: ${{ steps.artifact.outputs.sha256 }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
        run: |
          set -euo pipefail
          formula_preview="$RUNNER_TEMP/codex-router-formula.rb"
          cp release-source/verification/tooling/tests/fixtures/current-formula.rb "$formula_preview"
          node release-source/verification/tooling/update-homebrew-formula.ts \
            --formula "$formula_preview" \
            --version "$RELEASE_VERSION" \
            --sha256 "$ASSET_SHA256" \
            --source-commit "$SOURCE_COMMIT"
          cp "$formula_preview" "$formula_preview.first"
          node release-source/verification/tooling/update-homebrew-formula.ts \
            --formula "$formula_preview" \
            --version "$RELEASE_VERSION" \
            --sha256 "$ASSET_SHA256" \
            --source-commit "$SOURCE_COMMIT"
          cmp "$formula_preview.first" "$formula_preview"
          ruby -c "$formula_preview"

      - name: Retain dry-run formula preview
        if: env.RELEASE_DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-formula-preview
          path: ${{ runner.temp }}/codex-router-formula.rb

      - name: Publish GitHub release asset
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          ASSET_NAME: ${{ steps.artifact.outputs.name }}
          ASSET_PATH: ${{ steps.artifact.outputs.path }}
          ASSET_SHA256: ${{ steps.artifact.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          release_api="repos/${GITHUB_REPOSITORY}/releases"
          if release_id="$(gh api "${release_api}/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null)"; then
            :
          else
            release_id="$(
              gh api -X POST "${release_api}" \
                -f tag_name="${RELEASE_TAG}" \
                -f name="codex-router ${RELEASE_TAG}" \
                -f body="Prebuilt codex-router ${RELEASE_VERSION} for Apple Silicon macOS." \
                -F draft=false \
                -F prerelease=false \
                --jq '.id'
            )"
          fi

          release_json="${RUNNER_TEMP}/release-${release_id}.json"
          gh api "${release_api}/${release_id}" > "${release_json}"
          existing_asset_id="$(
            jq -r --arg asset_name "${ASSET_NAME}" \
              '.assets[] | select(.name == $asset_name) | .id' \
              "${release_json}"
          )"

          upload_response="${RUNNER_TEMP}/release-upload.json"
          candidate_asset_name="${ASSET_NAME}.candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_upload_token="${GH_TOKEN}"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${release_upload_token}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${ASSET_PATH}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${candidate_asset_name}" \
            > "${upload_response}"

          uploaded_asset_id="$(jq -r '.id' "${upload_response}")"
          uploaded_asset_name="$(jq -r '.name' "${upload_response}")"
          uploaded_asset_state="$(jq -r '.state' "${upload_response}")"
          if [[ "${uploaded_asset_name}" != "${candidate_asset_name}" || "${uploaded_asset_state}" != "uploaded" ]]; then
            echo "release asset upload did not reach the expected state" >&2
            exit 1
          fi
          uploaded_digest="$(gh api "${release_api}/assets/${uploaded_asset_id}" --jq '.digest')"
          if [[ "${uploaded_digest}" != "sha256:${ASSET_SHA256}" ]]; then
            echo "release asset digest does not match the packaged archive" >&2
            exit 1
          fi

          if [[ -n "${existing_asset_id}" ]]; then
            previous_asset_name="${ASSET_NAME}.previous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gh api -X PATCH "${release_api}/assets/${existing_asset_id}" \
              -f name="${previous_asset_name}" \
              > /dev/null
          fi
          if ! gh api -X PATCH "${release_api}/assets/${uploaded_asset_id}" \
            -f name="${ASSET_NAME}" \
            > /dev/null; then
            if [[ -n "${existing_asset_id}" ]]; then
              gh api -X PATCH "${release_api}/assets/${existing_asset_id}" \
                -f name="${ASSET_NAME}" \
                > /dev/null
            fi
            echo "unable to promote the verified release asset" >&2
            exit 1
          fi
          if [[ -n "${existing_asset_id}" ]]; then
            gh api -X DELETE "${release_api}/assets/${existing_asset_id}"
          fi

  publish-tap:
    name: Homebrew tap
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: release
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout release automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: automation
          persist-credentials: false

      - name: Install Node for formula automation
        uses: actions/setup-node@v4
        with:
          node-version-file: automation/verification/package.json

      - name: Checkout Homebrew tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          path: homebrew-taps
          repository: ShravanSunder/homebrew-taps
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew formula
        env:
          ASSET_SHA256: ${{ needs.release.outputs.asset_sha256 }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          SOURCE_COMMIT: ${{ needs.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          node automation/verification/tooling/update-homebrew-formula.ts \
            --formula homebrew-taps/Formula/codex-router.rb \
            --version "${RELEASE_VERSION}" \
            --sha256 "${ASSET_SHA256}" \
            --source-commit "${SOURCE_COMMIT}"

      - name: Register local Homebrew tap
        id: tap
        run: |
          set -euo pipefail
          tap_path="$(brew --repository)/Library/Taps/shravansunder/homebrew-taps"
          if [[ -e "${tap_path}" ]]; then
            echo "Homebrew tap path already exists on the release runner" >&2
            exit 1
          fi
          mkdir -p "$(dirname "${tap_path}")"
          ln -s "${GITHUB_WORKSPACE}/homebrew-taps" "${tap_path}"
          echo "path=${tap_path}" >> "${GITHUB_OUTPUT}"

      - name: Trust local Homebrew tap when supported
        run: |
          set -euo pipefail
          if brew help trust >/dev/null 2>&1; then
            brew trust shravansunder/taps
          else
            echo "Homebrew trust command is unavailable; skipping tap trust"
          fi

      - name: Validate Homebrew formula and installation
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        working-directory: homebrew-taps
        run: |
          set -euo pipefail
          ruby -c Formula/codex-router.rb
          brew style shravansunder/taps/codex-router
          brew audit --strict shravansunder/taps/codex-router
          brew install shravansunder/taps/codex-router
          brew test shravansunder/taps/codex-router
          brew linkage --test codex-router

          verify_installed_signature() {
            local binary="$1"
            local signature
            codesign --verify --strict --verbose=2 "${binary}"
            signature="$(codesign -dv --verbose=2 "${binary}" 2>&1)"
            if ! grep -qx "Identifier=${CODE_IDENTIFIER_PREFIX}.$(basename "${binary}")" <<<"${signature}" ||
              ! grep -qx "TeamIdentifier=${DEVELOPER_ID_TEAM}" <<<"${signature}"; then
              echo "Homebrew installed ${binary} without the ${CODE_IDENTIFIER_PREFIX} Developer ID signature" >&2
              exit 1
            fi
          }

          installed_binary="$(brew --prefix codex-router)/bin/codex-router"
          installed_description="$(file "${installed_binary}")"
          if [[ "${installed_description}" != *"Mach-O 64-bit executable arm64"* ]]; then
            echo "Homebrew installed a non-arm64 binary" >&2
            exit 1
          fi
          verify_installed_signature "${installed_binary}"
          if [[ "$("${installed_binary}" --version)" != "codex-router ${RELEASE_VERSION}" ]]; then
            echo "Homebrew installed an unexpected codex-router version" >&2
            exit 1
          fi

          for executable in agent-collaboration agent-sessions codex-router-board-upgrade; do
            installed_executable="$(brew --prefix codex-router)/bin/${executable}"
            if [[ ! -x "${installed_executable}" ]]; then
              echo "Homebrew did not install ${executable}" >&2
              exit 1
            fi
            verify_installed_signature "${installed_executable}"
            if [[ "$("${installed_executable}" --version)" != "${executable} ${RELEASE_VERSION}" ]]; then
              echo "Homebrew installed an unexpected ${executable} version" >&2
              exit 1
            fi
          done

      - name: Commit Homebrew formula update
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        working-directory: homebrew-taps
        run: |
          set -euo pipefail
          git add -- Formula/codex-router.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already matches this release"
            exit 0
          fi
          if [[ "$(git diff --cached --name-only)" != "Formula/codex-router.rb" ]]; then
            echo "tap update attempted to commit an unexpected path" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "codex-router ${RELEASE_VERSION}"
          if git push origin HEAD:main; then
            exit 0
          fi
          # verification/tooling/publish-homebrew-tap-local.ts may have pushed this release
          # first. The formula is deterministic, so identical content on the tap
          # means the release is already published.
          git fetch origin main
          if git diff --quiet FETCH_HEAD HEAD -- Formula/codex-router.rb; then
            echo "Homebrew formula already published for this release"
            exit 0
          fi
          echo "push rejected and the tap holds a different formula" >&2
          exit 1
