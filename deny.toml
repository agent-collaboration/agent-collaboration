[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Released sqlx-sqlite 0.9.0 caps libsqlite3-sys below 0.38; remove when a released SQLx permits libsqlite3-sys 0.39" },
]

[licenses]
exceptions = [
    # Transitive dependency of the JSON Schema validator; MIT No Attribution.
    { name = "borrow-or-share", version = "=0.2.4", allow = ["MIT-0"] },
]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
allow-git = [
    "https://github.com/cloudflare/workers-rs",
    "https://github.com/agent-collaboration/agent-fleet-sync",
    # The renderer repair is pinned to an exact version and revision in Cargo.toml.
    "https://github.com/agent-collaboration/iocraft",
]
unknown-registry = "deny"
unknown-git = "deny"
