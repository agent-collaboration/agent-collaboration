[profile.default]
retries = 0

[profile.ci]
fail-fast = false
retries = 0
status-level = "slow"
final-status-level = "slow"
# Report slow tests and terminate any test still running after five periods.
slow-timeout = { period = "60s", terminate-after = 5 }

# These suites own subprocesses, process groups, PTYs, fixed readiness budgets,
# and loopback/Unix listeners. Running them against each other creates host-level
# scheduling starvation that their semantic deadlines correctly report as failure.
# Process-runtime cases reserve every slot. Other tests can share the remaining
# scheduler slots with one member of the heavy fixture group below.
[test-groups]
process-runtime = { max-threads = 1 }
heavy-tests = { max-threads = 1 }

[[profile.ci.overrides]]
filter = "binary(update_reexec) | binary(runtime_restart) | binary(compiled_cli_host_acceptance) | binary(quota_reset_pty_test) | (package(=codex-router-auth) & test(=claude_oauth::tests::refresh_timeout_is_ambiguous_and_never_returns_the_old_token)) | (package(=codex-router-proxy) & test(=tests::tunnel_affinity_tests::async_websocket_tunnel_does_not_gate_forwarding_on_slow_affinity_recorder))"
test-group = "process-runtime"
threads-required = "num-test-threads"

# These real central/child cases also need an exclusive scheduling window;
# starving the archive or Serve child crosses their unchanged request and
# shutdown deadlines. The renewal proof gates its NotWriter reply explicitly.
[[profile.ci.overrides]]
filter = "binary(=board_request_effects_cli) | (package(=codex-router-host) & (test(=collaboration_runtime::board_composition::machine_session::mail_notice_events::harness::notification_owner::authority_recovery::real_renewal_republishes_after_paused_pass_and_not_writer_reports_confirmed_and_lost_authority) | test(tailscale_exposure::) | test(tailscale_process::) | test(collaboration_runtime::startup_contract_tests::)))"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Keep the exact TERM recorder grace and compiled WebSocket frame/count proof
# in the existing process-runtime window, apart from unrelated fixture load.
[[profile.ci.overrides]]
filter = "binary(=proxy_overload_passthrough) | (binary(=process_lifecycle) & test(=app_server_force_escalation_signals_and_reaps_once))"
test-group = "process-runtime"
threads-required = "num-test-threads"

# U66 / MS-10 requires a five-minute minimum repeat gap. This retained real-timer
# protocol proof observes both firings; its own receive deadlines remain bounded.
[[profile.ci.overrides]]
filter = "binary(wakeup_repeating_delivery) & test(=recurring_wake_stores_and_dispatches_two_distinct_pushes)"
slow-timeout = { period = "60s", terminate-after = 6 }

# The real ACP child emits FIFO receipts over a Unix socket within two seconds.
# Give it the existing process reservation while keeping that deadline intact.
[[profile.ci.overrides]]
filter = "package(=codex-router-host) & test(=external_provider_supervisor::tests::router_queue_drains_provider_prompts_in_fifo_order)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# These cases deliberately fill the real production queue or construct 260
# maximum descriptions / 31,000 historical effects. Keep those inputs and
# deadlines intact, but allow only one heavy case while ordinary tests retain
# the remaining scheduler slots. Process-runtime cases still require every slot.
[[profile.ci.overrides]]
filter = "binary(=held_queue_depth) | binary(=project_description_encoded_sizes) | (package(=message-board-storage) & test(=project_record_size_tests::history_growing_records_are_measured_without_capping_or_truncating))"
test-group = "heavy-tests"
threads-required = 1
slow-timeout = { period = "60s", terminate-after = 15 }

# These branch-added fixture workloads were also slow in the retained Linux CI
# run. Bound concurrent heavy work instead of adding another timing exception.
[[profile.ci.overrides]]
filter = "(package(=collaboration-service) & (test(=subscription_delivery::subscription_service::intent_progress_tests::deferred_history_does_not_grow_the_next_intent_pass) | (binary(=board_control_path) & test(=control_thread_list_pages_escape_heavy_holders_without_skips_or_repeats)) | (binary(=board_metadata_records) & test(=large_metadata_lists_continue_before_the_control_frame_limit)) | binary(=board_write_scale) | binary(=bounded_fleet_reads) | (binary(=bounded_post_lookup) & test(=post_lookup_costs_ignore_unopened_project_files))))"
test-group = "heavy-tests"
threads-required = 1

[[profile.ci.overrides]]
filter = "binary(=request_effects_public) & test(=a_large_fleet_write_returns_a_signed_public_continuation)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Real SIGKILL/reopen proofs share the native-process scheduling requirement
# of the other crash/restart cases. Keep their one-second storage fence intact.
[[profile.ci.overrides]]
filter = "package(=collaboration-service) & (test(=mail_push_delivery::tests::local_runtime::crash::crash_between_attribution_and_sdk_admission_leaves_neither_after_reopen) | test(/^mail_push_delivery::tests::remote_assembly::project_admission::crash::sigkill_between_/))"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Snapshot-install restart journeys own parent/child processes and real receivers.
# Reserve their scheduling window without changing any step deadline.
[[profile.ci.overrides]]
filter = "package(=codex-router-host) & test(collaboration_runtime::board_composition::tests::claim_restart::)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Real local Host/central journeys run in the required slower CI job.
[[profile.ci.overrides]]
filter = "binary(/^(board_records_e2e|board_central_e2e|local_mail_e2e|board_takeover_e2e|messaging_rules_e2e|installation_directory_e2e|mail_reconcile_e2e|mail_retirement_e2e|upgrade_binary_e2e|forwarding_real_timer)$/)"
test-group = "process-runtime"
threads-required = "num-test-threads"
