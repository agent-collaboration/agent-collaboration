[profile.default]
retries = 0

[profile.ci]
test-threads = "num-cpus"
fail-fast = false
retries = 0
status-level = "slow"
final-status-level = "slow"
# Report slow tests and terminate any test still running after five periods.
slow-timeout = { period = "60s", terminate-after = 5 }

# These suites own subprocesses, process groups, PTYs, fixed readiness budgets,
# and loopback/Unix listeners. Running them against each other creates host-level
# scheduling starvation that their semantic deadlines correctly report as failure.
# Process-runtime cases reserve every slot. Other tests can share the remaining
# scheduler slots with one member of the heavy fixture group below.
[test-groups]
process-runtime = { max-threads = 1 }
heavy-tests = { max-threads = 1 }

# These nested global-CLI startup cases passed in isolation but exhausted their
# unchanged 15-second initialization budget under the complete Host suite.
# Reserve the existing process window; preserve every wire assertion and budget.
[[profile.ci.overrides]]
filter = "package(=codex-router-host) & binary(=integration) & (test(/^auth_file_reload::/) | test(/^external_provider_composition::/) | test(/^global_harness_selection::/))"
test-group = "process-runtime"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "(package(=codex-router-host) & binary(=integration) & test(/^update_reexec::/)) | (package(=codex-router-host) & binary(=integration) & test(/^runtime_restart::/)) | (package(=codex-router-cli) & binary(=integration) & test(/^compiled_cli_host_acceptance::/)) | (package(=codex-router-quota-reset-test-harness) & binary(=e2e)) | (package(=codex-router-auth) & test(=claude_oauth::tests::refresh_timeout_is_ambiguous_and_never_returns_the_old_token)) | (package(=codex-router-proxy) & test(=tests::tunnel_affinity_tests::async_websocket_tunnel_does_not_gate_forwarding_on_slow_affinity_recorder))"
test-group = "process-runtime"
threads-required = "num-test-threads"

# These real central/child cases also need an exclusive scheduling window;
# starving the archive or Serve child crosses their unchanged request and
# shutdown deadlines. The renewal proof gates its NotWriter reply explicitly.
[[profile.ci.overrides]]
filter = "(package(=agent-collaboration) & binary(=integration) & test(/^board_request_effects_cli::/)) | (package(=codex-router-host) & (test(=collaboration_runtime::board_composition::machine_session::mail_notice_events::harness::notification_owner::authority_recovery::real_renewal_republishes_after_paused_pass_and_not_writer_reports_confirmed_and_lost_authority) | test(tailscale_exposure::) | test(tailscale_process::) | test(collaboration_runtime::startup_contract_tests::)))"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Enrollment fixtures retain their existing process reservation and deadlines.
# Native catalogue fixtures launch a bounded read-only CLI. Keep their five-second
# contract apart from unrelated process/IO load, as with the other process fixtures.
[[profile.ci.overrides]]
filter = "(package(=codex-router-host) | package(=collaboration-service)) & binary(=integration) & test(/^native_claude_catalogue::/)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Keep the exact TERM recorder grace and compiled WebSocket frame/count proof
# in the existing process-runtime window, apart from unrelated fixture load.
[[profile.ci.overrides]]
filter = "(package(=codex-router-cli) & binary(=integration) & test(/^proxy_overload_passthrough::/)) | (package(=codex-router-host) & binary(=integration) & test(=process_lifecycle::app_server_force_escalation_signals_and_reaps_once))"
test-group = "process-runtime"
threads-required = "num-test-threads"

# The real ACP child emits FIFO receipts over a Unix socket within two seconds.
# Give it the existing process reservation while keeping that deadline intact.
[[profile.ci.overrides]]
filter = "package(=codex-router-host) & test(=external_provider_supervisor::tests::router_queue_drains_provider_prompts_in_fifo_order)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# This controlled ACP release case owns a provider child and a bounded wait.
[[profile.ci.overrides]]
filter = "package(=codex-router-host) & binary(=integration) & test(=provider_pending_hub_races::human_mcp_control_test::dropped_human_mcp_waiter_does_not_cancel_or_redispatch_the_released_turn)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Drain existing process reservations first, then overlap the heavy lane and
# long shared tests. These overrides only set priority; the rules above retain
# their groups, slot reservations, retries and deadlines. The 50 band comes
# from D1 CI run 41994005347 (at least 30 seconds per test).
[[profile.ci.overrides]]
filter = "package(=codex-router-host) & binary(=integration) & (test(/^auth_file_reload::/) | test(/^external_provider_composition::/) | test(/^global_harness_selection::/))"
priority = 100

[[profile.ci.overrides]]
filter = "(package(=codex-router-host) & binary(=integration) & test(/^update_reexec::/)) | (package(=codex-router-host) & binary(=integration) & test(/^runtime_restart::/)) | (package(=codex-router-cli) & binary(=integration) & test(/^compiled_cli_host_acceptance::/)) | (package(=codex-router-quota-reset-test-harness) & binary(=e2e)) | (package(=codex-router-auth) & test(=claude_oauth::tests::refresh_timeout_is_ambiguous_and_never_returns_the_old_token)) | (package(=codex-router-proxy) & test(=tests::tunnel_affinity_tests::async_websocket_tunnel_does_not_gate_forwarding_on_slow_affinity_recorder))"
priority = 100

[[profile.ci.overrides]]
filter = "(package(=agent-collaboration) & binary(=integration) & test(/^board_request_effects_cli::/)) | (package(=codex-router-host) & (test(=collaboration_runtime::board_composition::machine_session::mail_notice_events::harness::notification_owner::authority_recovery::real_renewal_republishes_after_paused_pass_and_not_writer_reports_confirmed_and_lost_authority) | test(tailscale_exposure::) | test(tailscale_process::) | test(collaboration_runtime::startup_contract_tests::)))"
priority = 100

[[profile.ci.overrides]]
filter = "(package(=codex-router-host) | package(=collaboration-service)) & binary(=integration) & test(/^native_claude_catalogue::/)"
priority = 100

[[profile.ci.overrides]]
filter = "(package(=codex-router-cli) & binary(=integration) & test(/^proxy_overload_passthrough::/)) | (package(=codex-router-host) & binary(=integration) & test(=process_lifecycle::app_server_force_escalation_signals_and_reaps_once))"
priority = 100

[[profile.ci.overrides]]
filter = "package(=codex-router-host) & test(=external_provider_supervisor::tests::router_queue_drains_provider_prompts_in_fifo_order)"
priority = 100

[[profile.ci.overrides]]
filter = "package(=acp-client-runtime) & binary(=integration) & test(=create_settings_order::settings_tail_tests::silent_setting_response_expires_to_unknown_and_gates_session)"
priority = 50

[[profile.ci.overrides]]
filter = "package(=codex-router-cli) & test(=host_command::stop_tests::stop_times_out_without_claiming_success_or_signalling_an_unresponsive_peer)"
priority = 50
