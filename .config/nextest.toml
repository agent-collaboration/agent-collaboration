# Each modern Worker case owns an isolated workerd child and private SQLite state.
[[profile.default.overrides]]
filter = "package(=collaboration-central-cloudflare) & binary(=integration)"
test-group = "process-runtime"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "package(=collaboration-central-cloudflare) & binary(=integration)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# The admitted maximum-page proof retains 65,536 real rows and full reply bytes.
# Give that one native case the same process window as each isolated workerd case.
[[profile.default.overrides]]
filter = "package(=collaboration-central-tokio) & test(page_limits::maximum_list_and_inbox_pages_retain_the_extra_row_and_skip_nothing)"
test-group = "process-runtime"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "package(=collaboration-central-tokio) & test(page_limits::maximum_list_and_inbox_pages_retain_the_extra_row_and_skip_nothing)"
test-group = "process-runtime"
threads-required = "num-test-threads"

# Only the Worker CI step relaxes the broad Worker serial reservation, using
# reviewed isolation: per-child mkdtemp state and port 0 (workerd-storage.ts:199),
# per-fixture plans/JWKS listeners, and read-only bundles built before the suite.
# Local/default and ci reservations above stay unchanged. The 65,536-row Worker
# page case keeps every slot; other Worker cases share at most two slots.
[profile.worker-ci]
inherits = "ci"
test-threads = 2
status-level = "all"
final-status-level = "all"

[[profile.worker-ci.overrides]]
filter = "package(=collaboration-central-cloudflare) & binary(=integration) & !test(=workspace_requests::page_limits::maximum_list_and_inbox_pages_retain_the_extra_row_and_skip_nothing)"
test-group = "worker-ci"
threads-required = 1

[[profile.worker-ci.overrides]]
filter = "package(=collaboration-central-cloudflare) & binary(=integration) & test(=workspace_requests::page_limits::maximum_list_and_inbox_pages_retain_the_extra_row_and_skip_nothing)"
test-group = "process-runtime"
threads-required = "num-test-threads"
